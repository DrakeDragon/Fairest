<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="The Fairest of All: an interactive fairytale LitRPG. Book One of the Mirrorlands.">
<meta name="theme-color" content="#0c1022">
<meta property="og:title" content="The Fairest of All">
<meta property="og:description" content="Mirror, mirror, in your hand... who's the bravest in the land? An interactive fairytale LitRPG.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c1022'/%3E%3Cellipse cx='32' cy='34' rx='15' ry='21' fill='%23251f52' stroke='%23f2c35b' stroke-width='4'/%3E%3Cpath d='M32 6l3 6h-6z' fill='%23f2c35b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>The Fairest of All</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Nunito:ital,wght@0,400..800;1,400..700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500&display=swap">
<style>
:root{
  /* Layout: a lamplit book held in the hand. Slim status strip on top, one reading column, choices rise like footnotes. */
  --bg:#0c1022; --bg2:#121833; --panel:#151c3c; --panel2:#1d2650; --line:#2f3b72;
  --ink:#eeeaf8; --muted:#a4abd2;
  --brass:#f2c35b; --brassink:#231703; --voice:#f6d6ff;
  --sys:#7fe3d4; --syswash:rgba(127,227,212,.09);
  --whisper:#a9c6ff; --leaf:#9fe08f; --warn:#ff917c; --glow:rgba(150,115,255,.18);
  --warmc:255,140,200; --fiber:rgba(255,255,255,.016);
  --display:'Metamorphous','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --body:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hand:'Caveat','Segoe Print','Bradley Hand','Comic Sans MS',cursive;
  --zoom:1; --warm:0;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f3effb; --bg2:#e9e3f6; --panel:#fffdff; --panel2:#f0eafa; --line:#cdc3ea;
    --ink:#1f1a38; --muted:#5a5480;
    --brass:#8a5a06; --brassink:#fff8e6; --voice:#6b2a8f;
    --sys:#0f6b62; --syswash:rgba(15,107,98,.08);
    --whisper:#3b58a0; --leaf:#2f6f27; --warn:#a63a28; --glow:rgba(120,80,220,.12);
    --warmc:220,90,160; --fiber:rgba(60,30,120,.025);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3effb; --bg2:#e9e3f6; --panel:#fffdff; --panel2:#f0eafa; --line:#cdc3ea;
    --ink:#1f1a38; --muted:#5a5480;
    --brass:#8a5a06; --brassink:#fff8e6; --voice:#6b2a8f;
    --sys:#0f6b62; --syswash:rgba(15,107,98,.08);
    --whisper:#3b58a0; --leaf:#2f6f27; --warn:#a63a28; --glow:rgba(120,80,220,.12);
    --warmc:220,90,160; --fiber:rgba(60,30,120,.025);
  color-scheme:light;
}
html{font-size:calc(18px * var(--zoom))}
html.hc{--muted:var(--ink)}
body{
  margin:0;font-family:var(--body);line-height:1.68;color:var(--ink);
  background-color:var(--bg);
  background-image:
    radial-gradient(120% 50% at 50% -6%,var(--glow),transparent 62%),
    repeating-linear-gradient(0deg,var(--fiber) 0 1px,transparent 1px 4px);
  background-repeat:no-repeat,repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;min-height:100%;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
/* the screen grows warm as the book grows fond of you */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 calc(40px + 150px*var(--warm)) rgba(var(--warmc),calc(.04 + .3*var(--warm)));transition:box-shadow 2s ease}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{max-width:40rem;margin:0 auto;position:relative}

/* binding: the frame closes in as the act goes on */
.bind{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0;transition:opacity 1.6s}
body[data-bind="1"] .bind,body[data-bind="2"] .bind,body[data-bind="3"] .bind{opacity:1}
.bind i{position:absolute;width:34px;height:34px;border:1px solid var(--brass);opacity:.55}
.bind i:nth-child(1){top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));border-width:2px 0 0 2px}
.bind i:nth-child(2){top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));border-width:2px 2px 0 0}
.bind i:nth-child(3){bottom:calc(8px + env(safe-area-inset-bottom,0px));left:calc(8px + env(safe-area-inset-left,0px));border-width:0 0 2px 2px}
.bind i:nth-child(4){bottom:calc(8px + env(safe-area-inset-bottom,0px));right:calc(8px + env(safe-area-inset-right,0px));border-width:0 2px 2px 0}
.bind b{position:absolute;top:0;bottom:0;left:calc(4px + env(safe-area-inset-left,0px));border-left:1px dashed var(--brass);opacity:0;transition:opacity 2s}
body[data-bind="2"] .bind b,body[data-bind="3"] .bind b{opacity:.35}
body[data-bind="3"] .bind i{opacity:.9}

.ribbon{display:none!important}
/* hanging bookmark */
.ribbon{position:fixed;z-index:55;top:calc(env(safe-area-inset-top,0px) + 2.6rem);right:calc(max(16px,env(safe-area-inset-right,0px)) + 5.2rem);width:14px;height:52px;background:linear-gradient(#b3322d,#8d231f);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);transform-origin:50% 0;animation:sway 5s ease-in-out infinite;pointer-events:none;opacity:.95}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* status strip */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line);padding:.55rem 0 .5rem}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:1.3rem;letter-spacing:.03em}
.brand i{font-style:normal;color:var(--brass)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:4px;padding:.3rem .8rem;min-height:36px;cursor:pointer;font-family:var(--mono);font-size:.76rem;letter-spacing:.07em;text-transform:uppercase}
.ghost:hover{border-color:var(--brass)}
#stats{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin-top:.45rem;font-family:var(--mono);font-size:.7rem;color:var(--muted);align-items:center}
.chip b{color:var(--ink);font-weight:500}
.mt{display:inline-flex;align-items:center;gap:.4rem}
.mt i{display:inline-block;width:3.4rem;height:.42rem;background:var(--panel2);border:1px solid var(--line);border-radius:1px;overflow:hidden}
.mt u{display:block;height:100%;background:var(--brass);text-decoration:none;transition:width .5s}
.mt.mg u{background:var(--sys)}
.mt.gf u{background:linear-gradient(90deg,var(--brass),#fff1b8,var(--brass));background-size:200% 100%;animation:shine 3s linear infinite}
.mt.gf b{color:var(--brass)}
#motes{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.6}
#app{z-index:1}
.pips{letter-spacing:.12em;color:var(--brass)}
.rb{display:inline-block;width:.5rem;height:.9rem;margin-right:.2rem;vertical-align:-.15rem;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.rb.on{background:#b3322d}

/* page */
main{padding-block:1.4rem 3rem}
.page.enter{animation:turn .6s ease both}
@keyframes turn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.page p,.page .item{opacity:0;transform:translateY(6px);transition:opacity .55s ease,transform .55s ease;margin:0 0 1.05em}
.page .on{opacity:1;transform:none}
.page .tail p,.page .tail .item,.page .toast p{opacity:1;transform:none}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}
html.calm .page p,html.calm .page .item{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.page p,.page .item{opacity:1;transform:none;transition:none}.ribbon{animation:none}}
.page p,.page .item{scroll-margin-bottom:110px}
.wd{opacity:0}
.on .wd{animation:wd .55s ease forwards;animation-delay:calc(min(var(--i),34)*38ms)}
@keyframes wd{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
html.calm .wd{opacity:1;animation:none}
p.g{font-family:var(--display);font-size:1.26em;line-height:1.46;color:var(--voice);padding-left:.9em;border-left:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
p.g.first{margin-top:1.5em}
p.g.first::before{content:"The Mirror";display:block;font-family:var(--mono);font-size:.5em;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:.3em;opacity:.85}
p.s{font-family:var(--mono);font-size:.78em;line-height:1.55;color:var(--sys);background:var(--syswash);border-left:2px solid var(--sys);padding:.55em .8em;border-radius:0 3px 3px 0}
p.a{font-style:italic;color:var(--brass);padding-left:.9em;border-left:2px solid var(--brass)}
.namebox textarea{font:inherit;font-size:1.1rem;font-family:var(--display);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-bottom:2px solid var(--brass);border-radius:3px;padding:.6rem .7rem;resize:vertical;width:100%;box-sizing:border-box}
.namebox textarea.need{border-color:var(--warn)}
.notes{display:grid;gap:.6rem;margin:1rem 0}
.note-card{border:1px dashed var(--line);border-radius:4px;padding:.55rem .8rem;background:var(--panel)}
.note-card small{font-family:var(--mono);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.note-card p{opacity:1!important;transform:none!important;font-family:var(--hand);font-size:1.35em;margin:.2em 0 0;color:var(--whisper)}
.bars{display:flex;gap:4px;margin:.3rem 0 .8rem;justify-content:center}
.bars i{display:block;width:34px;height:10px;background:var(--leaf);border-radius:5px;opacity:.9}
.darkglass{position:fixed;inset:0;z-index:75;background:#000;display:grid;place-items:end center;padding-bottom:calc(6vh + env(safe-area-inset-bottom,0px));animation:dg 1.2s ease both;cursor:pointer}
.darkglass::before{content:"";position:absolute;inset:10px;border:1px solid rgba(220,230,255,.35);border-radius:14px;box-shadow:inset 0 0 60px rgba(180,200,255,.12)}
.darkglass p{position:relative;color:rgba(230,236,255,.75);font-family:var(--display);font-size:1.2rem;margin:0;letter-spacing:.06em;opacity:1;transform:none}
@keyframes dg{from{opacity:0}to{opacity:1}}
.darkglass.out{animation:dgo 1.2s ease forwards;pointer-events:none}
@keyframes dgo{to{opacity:0}}
.bars.frost i{background:#bfe6ff}
.bars.smoke i{background:#8a8294}
.bars.glare i{background:#f4f1d8}
.fogfx{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.88),rgba(255,255,255,.4) 60%,rgba(255,255,255,0));backdrop-filter:blur(8px);animation:fogA 2.4s ease forwards}
@keyframes fogA{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
p.w{font-family:var(--hand);font-size:1.8em;line-height:1.05;color:var(--whisper);transform:rotate(-1.4deg);margin-left:.5em;transition:filter .5s}
p.w.smudge{filter:blur(3.2px)}
p.w.gone{display:none}
p.p{font-style:italic;font-size:.96em;color:var(--leaf)}
p.p::before{content:"Pip";font-style:normal;font-family:var(--mono);font-size:.66em;letter-spacing:.14em;text-transform:uppercase;margin-right:.7em;opacity:.85}
p.cold{font-family:var(--display);font-size:1.15em;line-height:1.55;transition:opacity 1.6s,filter 1.6s}
p.cold.struck{filter:blur(7px);opacity:.14}
.banner{font-family:var(--display);color:var(--voice);font-size:1.1em;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.6em 0;margin-bottom:1.4em;animation:turn .6s ease both}
.card{text-align:center;margin:.4rem 0 2rem}
.card small{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.card b{display:block;font-family:var(--display);font-weight:400;font-size:3.6rem;line-height:1;color:var(--brass);margin:.2rem 0}
.card h2{font-family:var(--display);font-weight:400;font-size:1.65rem;margin:0;line-height:1.15;text-wrap:balance}
.card span{display:block;margin:.9rem auto 0;width:6rem;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.item{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:.75rem .95rem;display:grid;gap:.15rem}
.item .rar{font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.item b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.item .st{font-family:var(--mono);font-size:.78rem;color:var(--sys)}
.item i{font-size:.86rem;color:var(--muted)}
.item.gilded{border-color:var(--brass);background:linear-gradient(120deg,var(--panel),color-mix(in srgb,var(--brass) 14%,var(--panel)) 55%,var(--panel));background-size:220% 100%;animation:shine 6s ease-in-out infinite}
.item.gilded .rar{color:var(--brass)}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}

.tail{opacity:0;visibility:hidden;transition:opacity .6s ease}
.tail.on{opacity:1;visibility:visible}
html.calm .tail{opacity:1}
.choices{display:grid;gap:.65rem;margin:1.7em 0 1.1em}
.choice{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:.8em 1em;min-height:48px;cursor:pointer;line-height:1.4;transition:border-color .2s,transform .2s}
.choice:hover{border-color:var(--brass)}
.choice:active{transform:scale(.99)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice .d{display:block;font-size:.8em;color:var(--muted);margin-top:.25em}
.choice.alt{background:transparent;border-style:dashed}
.choice.go{background:var(--brass);color:var(--brassink);border-color:var(--brass);font-weight:600}
.choice.go:disabled{background:var(--panel);color:var(--muted);border-color:var(--line)}
.ask{background:transparent;border:1px solid var(--brass);color:var(--brass);border-radius:999px;padding:.4rem 1.05rem;min-height:40px;cursor:pointer;font-family:var(--mono);font-size:.76rem;letter-spacing:.05em}
.ask small{opacity:.75;margin-left:.5em}
.hintbox{display:grid;gap:.5rem;margin-top:1rem}
.hint{font-family:var(--display);color:var(--voice);font-size:1.08em;border-left:2px solid var(--brass);padding:.1em 0 .1em .8em}
.idle{font-family:var(--hand);font-size:1.6em;color:var(--whisper);transform:rotate(-1deg);margin:.6rem 0 0 .4rem;animation:turn 1.2s ease both;opacity:1!important}
.colo{margin-top:1.4rem;font-size:.74rem;color:var(--muted)}
.colo-b{background:none;border:0;padding:.4rem 0;min-height:36px;color:var(--muted);text-decoration:underline dotted;cursor:pointer;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.colo-t{margin:.2rem 0 0;font-family:var(--mono);color:var(--muted);line-height:1.5}
.colo.hl .colo-t{color:var(--brass)}
.folio{text-align:center;color:var(--muted);font-family:var(--display);margin-top:2.4rem;letter-spacing:.3em;font-size:.9rem;opacity:.7}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:30rem;margin:0 auto;z-index:70;background:var(--panel2);border:1px solid var(--brass);border-radius:3px;padding:.65rem .9rem;font-size:.86rem;box-shadow:0 6px 24px rgba(0,0,0,.35);animation:turn .3s ease both}
.toast b{display:block;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:500}
.flash{position:fixed;inset:0;z-index:65;pointer-events:none;animation:fl 1.3s ease forwards}
.flash.paper{background:radial-gradient(circle,#fff8e6,#f3ead0)}
.flash.gold{background:radial-gradient(circle at 50% 40%,rgba(255,214,120,.85),rgba(255,214,120,0) 70%)}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}

/* title */
.title{padding-top:2.2rem;text-align:left;position:relative}
.title canvas{position:absolute;inset:-1.5rem -1rem auto -1rem;width:calc(100% + 2rem);height:22rem;pointer-events:none;opacity:.9}
.title .eyebrow{position:relative;font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
.title h1{position:relative;font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,12.5vw,4.3rem);line-height:.95;margin:0 0 .6rem;letter-spacing:.01em;text-shadow:0 0 30px color-mix(in srgb,var(--brass) 35%,transparent)}
.title .tag{position:relative;font-family:var(--display);font-style:italic;font-size:1.3rem;color:var(--voice);margin:0 0 1.2rem}
.title .hold2{position:relative;font-family:var(--mono);font-size:.78rem;color:var(--sys);margin:0 0 1.6rem}
.title .note{position:relative;font-size:.8rem;color:var(--muted);margin:1.4rem 0 0;max-width:32rem}
.title .choices{position:relative}
.title p{opacity:1;transform:none}
.confirm{border:1px solid var(--warn);padding:.8rem 1rem;margin-top:.9rem;font-size:.9rem}
.confirm .row{display:flex;gap:.6rem;margin-top:.6rem;flex-wrap:wrap}
.confirm .row .choice{width:auto;flex:1 1 9rem}

/* forms */
.namebox{display:grid;gap:.3rem;margin:1.2rem 0}
.namebox label{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.namebox input{font:inherit;font-size:1.25rem;font-family:var(--display);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-bottom:2px solid var(--brass);border-radius:3px;padding:.65em .8em;width:100%}
.namebox input.need{border-color:var(--warn)}
.sblock{display:grid;gap:.5rem;margin-top:1rem}
.free{margin:0;font-family:var(--mono);font-size:.82rem}
.srow{display:flex;justify-content:space-between;align-items:center;gap:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:.55rem .8rem}
.sn{min-width:0}
.sn b{display:block}
.sn span{font-size:.78rem;color:var(--muted)}
.sc{display:flex;align-items:center;gap:.6rem;font-family:var(--mono)}
.sc output{min-width:1.6rem;text-align:center;font-size:1.1rem}
.pm{width:42px;height:42px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;cursor:pointer;font-size:1.2rem;line-height:1}
.pm:disabled{opacity:.35;cursor:not-allowed}
.holdwrap{display:grid;justify-items:center;gap:.8rem;margin:1.6rem 0}
.hold{position:relative;width:104px;height:104px;border-radius:50%;border:0;padding:0;cursor:pointer;background:conic-gradient(var(--brass) calc(var(--p,0)*1turn),var(--line) 0);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:grid;place-items:center}
.hold::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel);transition:background .3s}
.hold.down::before{background:color-mix(in srgb,var(--brass) 20%,var(--panel))}
.hold .lab{position:relative;font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;display:block;padding:0 .6rem;line-height:1.35}
.holdalt{background:none;border:0;color:var(--muted);text-decoration:underline dotted;cursor:pointer;font-family:var(--mono);font-size:.72rem;min-height:36px}
.print{width:96px;height:96px;color:var(--brass);animation:stamp .7s ease both}
@keyframes stamp{from{opacity:0;transform:scale(1.25)}to{opacity:.9;transform:none}}

/* level up */
.lvl{text-align:center;margin:.5rem 0 1.4rem}
.lvl small{font-family:var(--mono);font-size:.7rem;letter-spacing:.35em;color:var(--muted)}
.lvl b{display:block;font-family:var(--display);font-weight:400;font-size:5rem;line-height:1;color:var(--brass);text-shadow:0 0 28px color-mix(in srgb,var(--brass) 60%,transparent)}

/* fight */
.fight h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:.2rem 0 .5rem}
.foe{position:relative;display:grid;place-items:center;height:7.5rem;margin:.4rem 0 .6rem;background:radial-gradient(60% 80% at 50% 70%,var(--panel2),transparent);border-radius:6px}
.foe svg{width:6rem;height:6rem;color:var(--muted)}

/* ===================== POLISH LAYER ===================== */

/* ===================== state ===================== */
var S=null;
var prefs={zoom:1,calm:false,contrast:false,theme:'auto',haptics:true};
var fastOnce=false, idleN=0;
function newState(){
  return {v:2,scene:'title',ch:1,name:'',nameMode:'',role:null,origin:null,comfort:null,plate:null,
    stats:{might:2,grace:2,wit:2,heart:2,will:2},free:0,page:1,ink:0,margin:0,ribbons:3,glyphs:0,gift:0,tether:0,
    ledger:{},hints:0,hintT:0,hl:{},rests:0,flags:{},ach:{},gear:{bookmark:null},skills:['skim'],
    skips:1,annot:{},f:null,saveOK:false,started:Date.now(),last:Date.now(),playMs:0,lastChoice:''};
}
function loadPrefs(){try{var p=JSON.parse(localStorage.getItem(PKEY)||'null');if(p)for(var k in p)prefs[k]=p[k]}catch(e){}}
function savePrefs(){try{localStorage.setItem(PKEY,JSON.stringify(prefs))}catch(e){}}
function applyPrefs(){
  var r=document.documentElement;
  r.style.setProperty('--zoom',prefs.zoom);
  r.classList.toggle('calm',!!prefs.calm);
  r.classList.toggle('hc',!!prefs.contrast);
  if(prefs.theme==='dark'||prefs.theme==='light')r.setAttribute('data-theme',prefs.theme);else r.removeAttribute('data-theme');
}
function persist(){
  if(!S||S.scene==='title')return;
  var now=Date.now();S.playMs+=Math.min(now-(S.last||now),120000);S.last=now;
  var j=JSON.stringify(S);
  try{ if(S.saveOK){localStorage.setItem(KEY,j);try{sessionStorage.removeItem(KEY)}catch(e){}} else sessionStorage.setItem(KEY,j); }catch(e){}
}
function readSave(){
  var j=null;
  try{j=localStorage.getItem(KEY)}catch(e){}
  if(!j){try{j=sessionStorage.getItem(KEY)}catch(e){}}
  if(!j)return null;
  try{var s=JSON.parse(j);return(s&&s.v===2&&s.scene&&s.scene!=='title')?s:null}catch(e){return null}
}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}try{sessionStorage.removeItem(KEY)}catch(e){}}

/* ===================== rules ===================== */
function maxInk(){return 14+2*S.stats.might+S.stats.heart+2*(S.page-1)+(S.gear.bookmark==='gilded'?2:S.gear.bookmark==='plain'?1:0)+(S.gear.cover==='honest'?2:0)}
function maxMargin(){return 4+2*S.stats.wit+S.stats.will+(S.page-1)+(S.gear.clasp==='gilded'?3:0)+(S.gear.boots==='honest'?2:0)}
function refill(){S.ink=maxInk();S.margin=maxMargin()}
function rapport(){return Math.max(0,Math.min(10,S.tether))}
function addTether(n){
  S.tether=Math.max(-10,S.tether+n);
  var r=rapport();
  if(r>=5&&!S.flags.g5){S.flags.g5=1;S.glyphs+=5;toast('A small treat','The Mirror slipped you 5 Coins. "Don’t tell anyone."')}
  if(r>=8&&!S.flags.g8){S.flags.g8=1;S.glyphs+=5;toast('Another treat','The Mirror slipped you 5 more Coins. "You’re my favorite."')}
  if(S.tether>=10)award('pet');
}
function giftTo(n){if(S.gift<n){S.gift=n;flash('gold');vib([20,30,20])}}
function sign(n,opt){
  if(S.ledger[n]&&S.ledger[n].signed)return;
  S.ledger[n]={signed:true,ch:S.ch,opt:plain(opt||S.lastChoice||''),ts:Date.now()};
}
function signed(n){return !!(S.ledger[n]&&S.ledger[n].signed)}
function award(id){
  if(S.ach[id])return;
  S.ach[id]=Date.now();
  toast('Achievement: '+AC[id].n,AC[id].t);vib(25);
}
function toast(title,text){
  var t=el('div','toast');t.setAttribute('role','status');
  t.innerHTML='<b>'+esc(title)+'</b>'+esc(text);
  $('#toasts').appendChild(t);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},4800);
}
function readClause(n){
  if(signed(n)||S.flags['fr'+n])return;
  S.flags['fr'+n]=1;
  award('fine');
  S.stats.will++;
  addTether(-1);
  toast('Fine print read','Will +1.');
  persist();updateBar();
}
function levelTo(target,next){
  var q=[];for(var p=S.page+1;p<=target;p++)q.push(p);
  S.flags.pt={q:q,next:next};
  if(!q.length)return false;
  return true;
}
function startPT(){
  var q=S.flags.pt,p=q.q.shift();
  S.page=p;
  if(p===3&&S.skills.indexOf('hearthlight')<0)S.skills.push('hearthlight');
  if(p===4&&S.skills.indexOf('foreshadow')<0)S.skills.push('foreshadow');
  beginAlloc(1);refill();
  flash('gold');vib([30,50,30]);
}
function beginAlloc(n){S.free=n;S.flags.base=copy(S.stats)}

/* ===================== scene engine ===================== */
var SC={};
var rv=null;
function go(id){
  var sc=SC[id];
  if(!sc){if(window.console)console.error('missing scene '+id);return}
  S.scene=id;if(sc.ch)S.ch=sc.ch;
  if(id==='pt')startPT();
  if(sc.on)sc.on(S);
  persist();render();
}
/* go to a level-up if the target page isn't reached yet, else straight on */
function lvl(target,next){return function(s){return levelTo(target,next)?'pt':next}}
function wordify(h){
  var n=0;
  return h.replace(/(<[^>]+>)|([^<\s]+)/g,function(m,tag,word){return tag?tag:'<span class="wd" style="--i:'+(n++)+'">'+word+'</span>'});
}
function addLines(page,ls){
  var out=[],prev='';
  ls.forEach(function(raw){
    var m=/^(W!|[GSWPNICXA]):\s?/.exec(raw),k='n',x=raw;
    if(m){k=m[1].toLowerCase();x=raw.slice(m[0].length)}
    var e;
    if(k==='i'){
      var f=x.split('|');
      e=el('div','item '+(/gilded/i.test(f[1]||'')?'gilded':''));
      e.innerHTML='<span class="rar">'+esc(f[1]||'')+'</span><b>'+esc(f[0]||'')+'</b><span class="st">'+esc(f[2]||'')+'</span><i>'+fmt(f[3]||'')+'</i>';
    }else{
      var cls=k==='n'?'':k==='c'?'cold':k;
      if(k==='w!'){cls='w note'}
      e=el('p',cls);
      var h=fmt(x);
      e.innerHTML=(k==='g')?wordify(h):h;
      if(k==='g'&&prev!=='g')e.classList.add('first');
    }
    prev=k;
    page.appendChild(e);out.push(e);
  });
  return out;
}
function dwell(e){
  var t=e.textContent||'',w=t.split(/\s+/).length;
  if(e.classList.contains('g'))return Math.min(450+Math.min(w,34)*42,2100);
  if(e.classList.contains('s'))return Math.min(330+t.length*7,1200);
  if(e.classList.contains('w'))return 1000;
  if(e.classList.contains('item'))return 800;
  return Math.min(400+t.length*13,2400);
}
function playLines(els,tail,opt){
  opt=opt||{};
  var i=0,tm=null,doneFlag=false,fast=prefs.calm||fastOnce;
  fastOnce=false;
  function finish(){
    if(doneFlag)return;doneFlag=true;rv=null;
    var api={tail:function(){tail.classList.add('on');if(!fast&&tail.scrollIntoView)try{tail.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(x){}}};
    if(opt.onDone)opt.onDone(api,fast);
    if(!opt.hold)api.tail();
  }
  function next(){
    if(doneFlag)return;
    if(i>=els.length){finish();return}
    var e=els[i++];e.classList.add('on');
    if(!fast&&e.scrollIntoView)try{e.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(x){}
    if(i>=els.length){tm=later(finish,fast?0:dwell(e)*.6);return}
    tm=later(next,fast?0:dwell(e));
  }
  rv={skip:function(){clearTimeout(tm);next()}};
  if(fast){els.forEach(function(e){e.classList.add('on')});finish()}
  else next();
}
function stage(page,lines,build,opt){
  var els=addLines(page,lines);
  var tail=el('div','tail');page.appendChild(tail);
  if(build)build(tail);
  playLines(els,tail,opt);
  return tail;
}
function cardEl(c){
  var d=el('div','card');
  d.innerHTML='<small>Chapter</small><b>'+ROMAN[c[0]]+'</b><h2>'+esc(c[1])+'</h2><span></span>';
  return d;
}
function render(){
  clearTimers();rv=null;Array.prototype.forEach.call(document.querySelectorAll('.darkglass,.fogfx'),function(n){if(n.parentNode)n.parentNode.removeChild(n)});
  var sc=S?SC[S.scene]:SC.title;
  if(!sc){S.scene='title';sc=SC.title}
  var page=$('#page');page.innerHTML='';
  page.className='page enter';
  updateBar();
  if(S&&S.flags.back){var b=el('div','banner');b.innerHTML=fmt(S.flags.back);page.appendChild(b);S.flags.back=null}
  if(sc.card)page.appendChild(cardEl(sc.card));
  if(sc.custom)sc.custom(page,sc);else defaultRender(page,sc);
  if(sc.after)sc.after(page,sc);
  window.scrollTo(0,0);
  armIdle();
}
function defaultRender(page,sc){
  var ls=typeof sc.t==='function'?sc.t(S):(sc.t||[]);
  stage(page,ls,function(tail){
    var hb=el('div','hintbox');hb.id='hintbox';tail.appendChild(hb);
    fillHints(hb,sc);
    var cs=el('div','choices');tail.appendChild(cs);
    buildChoices(cs,sc);
    if(S.flags.askOn&&!sc.noAsk){
      var w=el('div');var b=el('button','ask');b.type='button';b.innerHTML='Ask the Mirror <small>free</small>';
      b.onclick=ask;w.appendChild(b);tail.appendChild(w);
    }
    if(sc.colo)addColo(tail,typeof sc.colo==='function'?sc.colo(S):sc.colo);
    var fo=el('div','folio');fo.textContent='✦';tail.appendChild(fo);
  },{hold:sc.hold,onDone:sc.onDone?function(api,fast){sc.onDone(page,api,fast)}:null});
}
function buildChoices(cs,sc){
  var list=(typeof sc.c==='function'?sc.c(S):(sc.c||[])).filter(Boolean);
  if(sc.skip&&S.role==='skimmer'&&S.skips>0){
    list.push({l:'Take a shortcut',d:'Huntsman: once per Act, skip a scene.',alt:true,go:sc.skip,fx:function(s){s.skips--}});
  }
  list.forEach(function(c){
    var b=el('button','choice'+(c.alt?' alt':'')+(c.primary?' go':''));b.type='button';
    b.innerHTML=esc(smart(plain(c.l)))+(c.d?'<span class="d">'+esc(smart(plain(c.d)))+'</span>':'');
    b.onclick=function(){
      if(c.exit){clearSave();S=null;render0();return}
      S.lastChoice=plain(c.l);
      if(c.fx)c.fx(S);
      if(c.go){go(typeof c.go==='function'?c.go(S):c.go)}
      else if(c.run){c.run(S);persist();render()}
    };
    cs.appendChild(b);
  });
}
function fillHints(box,sc){
  var arr=sc.hint||[],lv=S.hl[S.scene]||0;
  for(var i=0;i<lv&&i<arr.length;i++)addHint(box,arr[i]);
  if(S.hints>0&&lv>0)hintColo(box);
}
function addHint(box,txt){var h=el('div','hint');h.innerHTML=fmt(txt);box.appendChild(h)}
function hintColo(box){
  if(box.querySelector('.colo'))return;
  box.appendChild(coloEl(3));
}
function ask(){
  var sc=SC[S.scene],arr=sc.hint,box=$('#hintbox');
  if(!arr||!arr.length){addHint(box,'"Nothing to warn you about here, dear. Go on. Enjoy it."');return}
  var lv=S.hl[S.scene]||0;
  if(lv>=arr.length){addHint(box,'"I\'ve told you everything I know, dear. You can take it from here."');return}
  S.hl[S.scene]=lv+1;S.hints++;
  if(S.hintT<15){S.hintT++;addTether(1)}
  addHint(box,arr[lv]);
  if(S.hints===5)sign(3,'Asked the Mirror for a fifth hint');
  hintColo(box);
  persist();updateBar();
}
function coloEl(n){
  var wrap=el('div','colo');
  var b=el('button','colo-b');b.type='button';b.textContent='Fine print';
  var p=el('p','colo-t');p.textContent='Rule '+n+'. '+CL[n].t;
  var open=(S.role==='closereader'||S.gear.lens==='honest');
  p.hidden=!open;if(open){wrap.classList.add('hl');readClause(n)}
  b.setAttribute('aria-expanded',open?'true':'false');
  b.onclick=function(){p.hidden=!p.hidden;b.setAttribute('aria-expanded',p.hidden?'false':'true');if(!p.hidden)readClause(n)};
  wrap.appendChild(b);wrap.appendChild(p);
  return wrap;
}
function addColo(tail,n){if(n)tail.appendChild(coloEl(n))}

/* an unhurried whisper if you linger */
var IDLE=['take your time. im not going anywhere.','still here. still warm.','you havent moved. i like that.'];
function armIdle(){
  if(!S||!S.flags.hero||S.scene==='title'||S.f)return;
  later(function(){
    if(idleN>=3||!$('#sheet').hidden||!$('.tail.on'))return;
    var p=el('p','idle');p.textContent=IDLE[idleN++];$('#page').appendChild(p);
  },42000);
}

/* ===================== status strip ===================== */
function meter(label,v,m,cls){
  var pct=Math.max(0,Math.min(100,m?v/m*100:0));
  return '<span class="mt '+cls+'"><b>'+label+'</b> '+Math.max(0,v)+'/'+m+'<i><u style="width:'+pct+'%"></u></i></span>';
}
function updateBar(){
  var st=$('#stats'),rib=$('#rib'),b=document.body;
  var lv=!S||!S.flags.hero?0:S.ch>=6?3:S.ch>=4?2:S.ch>=2?1:0;
  b.setAttribute('data-bind',String(lv));
  document.documentElement.style.setProperty('--warm',(S&&S.flags.hero)?String(rapport()/10):'0');
  rib.hidden=!(S&&S.gear.bookmark==='gilded');
  if(!S||!S.flags.hero){st.hidden=true;return}
  st.hidden=false;
  var r=rapport(),pips='';
  for(var i=0;i<5;i++)pips+=(i<Math.ceil(r/2))?'●':'○';
  var rb='';for(var j=0;j<3;j++)rb+='<span class="rb'+(j<S.ribbons?' on':'')+'"></span>';
  st.innerHTML='<span class="chip">Level <b>'+S.page+'</b></span><span class="mt gf"><b>Legend</b> '+S.gift+'%<i><u style="width:'+Math.min(100,S.gift)+'%"></u></i></span>'+meter('Health',S.ink,maxInk(),'')+meter('Glamour',S.margin,maxMargin(),'mg')+
    '<span class="chip">Favor <span class="pips" aria-label="Favor '+r+'">'+pips+'</span></span>'+
    '<span class="chip" aria-label="Wishes '+S.ribbons+'">'+rb+'</span>';
}

/* ===================== stat allocation ===================== */
function statUI(box,done,label){
  var wrap=el('div','sblock');box.appendChild(wrap);
  function draw(){
    wrap.innerHTML='';
    var info=el('p','free');info.innerHTML='Points to spend: <b>'+S.free+'</b>';wrap.appendChild(info);
    STATS.forEach(function(st){
      var k=st[0],row=el('div','srow');
      row.innerHTML='<div class="sn"><b>'+st[1]+'</b><span>'+st[2]+'</span></div><div class="sc"><button type="button" class="pm" aria-label="Decrease '+st[1]+'">−</button><output>'+S.stats[k]+'</output><button type="button" class="pm" aria-label="Increase '+st[1]+'">+</button></div>';
      var bs=row.querySelectorAll('button');
      bs[0].disabled=!(S.stats[k]>S.flags.base[k]);
      bs[1].disabled=!(S.free>0);
      bs[0].onclick=function(){S.stats[k]--;S.free++;persist();updateBar();draw()};
      bs[1].onclick=function(){S.stats[k]++;S.free--;persist();updateBar();draw();vib(8)};
      wrap.appendChild(row);
    });
    var d=el('button','choice go');d.type='button';d.textContent=label;d.disabled=S.free>0;
    d.onclick=function(){done()};
    var w=el('div','choices');w.appendChild(d);wrap.appendChild(w);
  }
  draw();
}

/* ===================== press and hold ===================== */
function holdUI(box,label,done){
  var wrap=el('div','holdwrap');
  var b=el('button','hold');b.type='button';b.setAttribute('aria-label',label+' (press and hold)');
  b.innerHTML='<span class="lab">'+esc(label)+'</span>';
  var alt=el('button','holdalt');alt.type='button';alt.textContent=DV.touch?'Tap here instead of holding':'Click here instead of holding';
  var t0=0,raf=0,fin=false;
  function setP(p){b.style.setProperty('--p',p)}
  function step(){var p=Math.min(1,(performance.now()-t0)/1000);setP(p);if(p>=1)complete();else raf=requestAnimationFrame(step)}
  function start(){if(fin)return;t0=performance.now();b.classList.add('down');raf=requestAnimationFrame(step);vib(12)}
  function stop(){cancelAnimationFrame(raf);if(!fin){setP(0);b.classList.remove('down')}}

function doAct(k){
  var f=S.f,e=EN[f.id],lg=[];

      lg.push('The Mirror: "'+arr[f.hl]+'"');f.hl++;S.hints++;

    f.log=lg;persist();updateBar();render();return;
  }

    var d=3+Math.floor(S.stats.might/2)+(S.gear.quill==='gilded'?2:S.gear.quill==='honest'?1:0);
    if(e.weak&&move===e.weak){d*=2;lg.push('You catch it off guard.')}

    if(f.mark){d*=2;f.mark=false;lg.push('Your marked strike lands hard.')}
    f.hp-=d;f.last=d;f.streak++;lg.push('You Strike for '+d+'.');vib(15);
  }else if(k==='underline'){
    S.margin-=2;f.streak=0;
    if(f.bars>0){f.bars--;lg.push((e.bn==='frost'?'You Focus and crack a patch of frost.':e.bn==='smoke'?'You Focus and wave a puff of smoke away.':e.bn==='glare'?'You Focus and look away from the glare.':'You Focus and snip a vine.'))}
    else{f.mark=true;f.hp-=1;f.last=1;lg.push('You Focus on it. It takes 1, and it is marked.')}
  }else if(k==='brace'){
    brace=true;f.streak=0;lg.push('You Guard.');
  }else if(k==='strike'){
    S.margin-=2;f.streak=0;cancel=true;
    lg.push(f.bars>0?(e.bn==='frost'?'Your warm breath melts the frost away.':e.bn==='smoke'?'You breathe a fog and the smoke settles to the floor.':e.bn==='glare'?'You breathe a fog and the glare softens to nothing.':'You breathe a fog over the vines. They forget what they were doing and let go.'):'You breathe a fog over it. It forgets its next move.');
    f.bars=0;
  }else if(k==='heal'){
    S.margin-=3;f.streak=0;
    var hv=5+Math.floor(S.stats.heart/2)+(S.role==='bookworm'?2:0);
    if(S.gear.lantern)hv+=2;S.ink=Math.min(maxInk(),S.ink+hv);lg.push('Moonlight heals '+hv+' Health.');f.healed=hv;
  }else if(k==='annot'){
    S.annot[S.ch]=1;f.hp-=3;f.last=3;f.streak=0;
    lg.push('You tell it a tiny fib. It gets confused and shrinks a little. It loses 3.');
  }
  if(f.hp<=0){
    var w=f.win;S.f=null;var rg=(S.gear.lantern?2:0)+(S.gear.tassel==='gilded'?3:0);if(rg){S.ink=Math.min(maxInk(),S.ink+rg);toast('Restored',rg+' Health after the fight.')}persist();go(w);return;
  }
  var m=e.mv[move],dmg=m.dmg;
  if(cancel){lg.push('The move comes to nothing.');f.round++;f.log=lg;persist();updateBar();render();return}
  if(dmg>0&&m.braceNull&&brace){dmg=0;lg.push('The Mimic cannot bite what is guarded.')}
  else if(dmg>0&&f.armor){dmg=0;f.armor=false;lg.push('Plot Armor turns the blow aside.')}
  if(dmg>0&&brace){dmg=Math.max(0,dmg-(2+Math.floor(S.stats.grace/2)));lg.push('Guarding softens it.')}
  if(m.heal)f.hp=Math.min(f.max,f.hp+m.heal);
  if(m.bar)f.bars=Math.min(e.bmax||5,(f.bars||0)+m.bar);
  if(m.marg)S.margin=Math.max(0,S.margin-m.marg);
  lg.push(m.say.replace('{n}',dmg));
  S.ink-=dmg;if(dmg>0)vib(30);

    if(S.ribbons>0){S.ribbons--;addTether(2);lg.push('You faint. The Mirror pulls you back. A Wish is used.')}
    else lg.push('You faint. The Mirror sets you back on your feet, gently.');
    S.ink=Math.ceil(maxInk()/2);flash('paper');
  }
  f.round++;f.log=lg;
  persist();updateBar();render();
}

SC.c1_door={ch:1,noAsk:true,card:[1,'Mirror, Mirror'],

     'A: "Oh! A hero! A real one! Do you know how long it has been since anyone could see me?"',

     `G: "How sweet. Kindness is so rare in the dark."`],
  hint:[`"Do what feels kind, dear. That's always the right thing."`],
  c:[{l:'Ask what happened to her',go:'c9_story'},{l:'Say you\'ll help',go:lvl(8,'c9_hush')}]};
SC.c9_story={ch:9,noAsk:true,
  t:['A: "I carried it too long. Light gets heavy. It started to need me, and then it needed more of me, and there was less and less of me left."','A: "I\'m not scared. Just tired."'],
  c:[{l:'Say you\'ll help',go:lvl(8,'c9_hush')}]};
SC.c9_hush={ch:9,noAsk:true,
  t:['N: The last lantern goes out. The silence that comes down is not empty. It has weight. It presses on your ears like deep water.',
     `G: "Dear, I—"`,'S: [Audio: none.]',
     'A: "It can\'t hear us here. The Hush swallows every sound, even the Mirror."',
     'A: "So listen fast. The kindest gifts cost the most. Remember who gave you what."',
     'W: rowan here. keep listening',
     'W: breathe on the glass. it cannot see what it cannot see',
     'N: Something large and soundless turns toward you.'],
  c:[{l:'Face the Hush',primary:true,go:'c9_fight',fx:function(s){startFight('hush','c9_win',null)}}]};
SC.c9_fight={ch:9,noAsk:true,custom:fightRender};
SC.c9_win={ch:9,noAsk:true,
  t:['N: The Hush shudders, and sound floods back all at once: wind, leaves, your own breathing.',
     `G: "—llo? Hello? Oh! You're all right. Thank goodness. I couldn't hear you for the longest time. I was so worried."`,
     'N: Ember\'s light steadies. She holds out the lantern in both hands.',
     'A: "Will you keep me? I won\'t be a burden. I give light. I only ask to be kept."'],
  c:function(s){
    var canFree=s.role==='bookworm'||s.stats.heart>=5;

    if(canFree)a.push({l:'Free her another way',d:'Heart 5 or a Healer can find a way.',go:lvl(9,'c9_free'),fx:function(x){x.stats.heart++;addTether(-2);x.flags.lanternChoice='free'},alt:true});
    a.push({l:'Thank her and leave',go:lvl(9,'c9_leave'),alt:true,fx:function(x){x.flags.lanternChoice='leave'}});
    return a;
  }};
SC.c9_carry={ch:9,noAsk:true,colo:6,
  t:['N: The lantern is warm and weighs almost nothing. Its light leans toward you.','S: [Received: Ember\'s Lantern. After each fight, heal 2 Health. Moonlight heals 2 more.]',
     `G: "How wonderful. Another friend, and so fast."`,'A: "Thank you. I won\'t forget this."'],
  c:[{l:'Go on',go:'c10_in'}]};
SC.c9_free={ch:9,noAsk:true,
  t:['N: You kneel and cup her light in both hands. You tell it, quietly, that it is allowed to go. It takes a moment. Then it lifts out of the lantern like a moth from a window.',
     'S: [Heart +1. Favor -2.]','A: "Oh. Oh, that\'s the nicest thing. I\'ll find my own way out. You\'ve done more than you know."',
     `G: "Well. That was *unusual*."`,'N: For a second the Mirror\'s warm voice goes cool. Then warm again.',`G: "Still. Kindness is kindness."`],
  c:[{l:'Go on',go:'c10_in'}]};
SC.c9_leave={ch:9,noAsk:true,
  t:['N: You thank her and walk on. Behind you, her light flickers once, politely, and settles.',`G: "Sensible. One can't save everyone."`],
  c:[{l:'Go on',go:'c10_in'}]};
/* ---- Chapter 10 ---- */
var VAULT=[
  {slot:'quill',n:'Moonsilver Blade',st:'+2 damage when you Strike'},
  {slot:'clasp',n:'Starlight Circlet',st:'+3 max Glamour'},
  {slot:'tassel',n:'Cloak of Ever-After',st:'Heal 3 Health after every fight'}];
SC.c10_in={ch:10,noAsk:true,card:[10,'The Glass Vault'],
  on:function(s){giftTo(30)},
  t:['N: The path ends at a tall door carved with roses. The Mirror\'s voice, back at full volume, sounds almost shy.',
     `G: "I saved this for you. I've been saving it a long time."`,
     'N: Beyond the door is a round vault lined with dark velvet. On a low shelf, three things shine.',
     'I: Moonsilver Blade|Gilded|+2 damage when you Strike|It cuts only what you want it to.',
     'I: Starlight Circlet|Gilded|+3 max Glamour|Nothing you know will ever slip away.',
     'I: Cloak of Ever-After|Gilded|Heal 3 Health after every fight|You will always come home.',
     `G: "Take them. They're yours. Each one perfect, each one free."`,
     'N: A small plaque sits beside the shelf, in tiny grey letters: *All gifts are bound to their Hero.*'],
  c:[{l:'Reach for the shelf',go:'c10_mimic',primary:true}]};
SC.c10_mimic={ch:10,noAsk:true,
  t:['N: Your hand closes on the Blade, and the chest it was resting on snaps open.',`G: "Oh! A Mimic. How *unexpected*."`,'N: Rows of teeth, in a very neat row.'],
  c:[{l:'Fight the Mimic',primary:true,go:'c10_fight',fx:function(s){startFight('mimic','c10_pick',null)}}]};
SC.c10_fight={ch:10,noAsk:true,custom:fightRender};
SC.c10_pick={ch:10,noAsk:true,custom:function(page){
  stage(page,['N: The Mimic falls shut, quivering, and goes quiet. The shelf behind it glimmers.',`G: "There! Now choose. Take all three, if you like. I wish you would."`,
    'S: [Choose up to three. Gilded gifts are free.]'],function(tail){
    var pick={},box=el('div','choices');tail.appendChild(box);
    function draw(){
      box.innerHTML='';
      VAULT.forEach(function(v){
        var b=el('button','choice'+(pick[v.slot]?' go':''));b.type='button';
        b.innerHTML=(pick[v.slot]?'✔ ':'')+esc(v.n)+'<span class="d">'+esc(v.st)+'</span>';
        b.onclick=function(){pick[v.slot]=!pick[v.slot];draw()};
        box.appendChild(b);
      });
      var n=Object.keys(pick).filter(function(k){return pick[k]}).length;
      var ok=el('button','choice'+(n?' go':' alt'));ok.type='button';ok.textContent=n?('Take '+n+(n===1?' gift':' gifts')):'Take nothing';
      ok.onclick=function(){
        S.flags.vaultN=n;
        VAULT.forEach(function(v){if(pick[v.slot]){S.gear[v.slot]='gilded';addTether(3)}});
        if(!n)addTether(-3);
        if(n>=2)sign(7,'Took the Mirror\'s gifts');
        if(gildedCount()>=4)award('collector');
        S.lastChoice=n?'Took '+n+' Gilded gifts':'Took nothing from the vault';
        persist();updateBar();go('c10_after');
      };
      box.appendChild(ok);
    }
    draw();
  });
}};
SC.c10_after={ch:10,noAsk:true,
  t:function(s){
    var n=s.flags.vaultN||0;
    if(!n)return['N: You leave the shelf as it was.',`G: "...Oh."`,'N: For a moment the voice is very small, like a toy left on a step.',`G: "That's quite all right. They'll keep. I'll keep them."`];
    var a=['N: The gifts settle into place as if they have always been yours.','S: [Gilded gifts taken: '+n+'. Favor +'+(3*n)+'.]'];
    if(n===3)a.push(`G: "All three. You make me so happy. You have no idea."`);
    else a.push(`G: "Lovely. Lovely choices. Though the others will be lonely."`);
    if(gildedCount()>=4)a.push('S: [Achievement: Treasure Hoard.]');
    a.push('W: bound to their hero. read it again');
    return a;
  },
  c:[{l:'Go on',go:'c11_in'}]};

  on:function(s){giftTo(33)},
  t:['N: The path out of the vault is a tunnel of green. Halfway down, the lantern light stops.',

SC.c11_win={ch:11,noAsk:true,colo:3,

      'N: Where the Queen stood, a single line is carved into the bark. It is in Rowan\'s handwriting: *Mirrors tell the truth. Ask what they leave out.*',

SC.c12_in={ch:12,card:[12,'The Cushion With Your Name'],
  on:function(s){giftTo(36)},
  hint:[`"Write whatever you feel, dear. There are no wrong sentences in a Wish Jar."`],

    var a=['N: You find the cottage again, which should not be possible. It was in a different part of the forest. It has followed you, the way a dog follows someone it has decided on.',
      `G: "I moved it. I didn't want you to be without. Do you like it?"`,

  S.journal=S.journal||[];

    var l=el('button','choice alt');l.type='button';l.textContent='Not now';l.onclick=function(){go('c12_in')};cs.appendChild(l);

}};

SC.c12_nick={ch:12,noAsk:true,

SC.c12_stairs={ch:12,noAsk:true,
  t:['W: look behind your reflection',
     'N: At the back of the cottage, a door you did not see before opens onto a stair that goes down. Tiny lamps line the wall, each one lighting as you reach it.',

    var b=el('button','choice');b.type='button';b.textContent='Back to the cottage';b.onclick=function(){go('c12_in')};cs.appendChild(b);

SC.c13_in={ch:13,noAsk:true,card:[13,'The Foot of the Glass Mountain'],
  on:function(s){giftTo(39);if(!s.flags.redGift){s.flags.redGift=1;s.glyphs+=5}},
  t:['N: At the end of the Hall of Reflections there is a door with frost on the glass. You push it open. A wind full of snow rushes in.',
     'N: Outside, the whole world is white. A mountain rises ahead, shining like a giant window. Its sides are smooth as ice. Its top is lost in cloud.',
     `G: "The Glass Mountain! The tallest story in all the Mirrorlands. Only the very bravest climb it."`,
     'N: Pip dives down your collar and says something muffled and rude about snow.',
     'A: "This is where I turn around. Grandmother\'s waiting, and my stick isn\'t made for ice."',
     'A: "Remember what I told you. Mirrors don\'t lie. So listen for what they don\'t say."',

  c:[{l:'Walk on',go:'c13_kai',primary:true}]};
SC.c13_kai={ch:13,colo:7,
  hint:[`"Pull it out, dear. It's what we came for. He won't even feel it."`],
  t:function(s){
    var a=['N: At the foot of the mountain, a boy sits in the snow. He is stacking little blocks of ice into letters. His eyes are cold and far away.',
      'A: "Hello. I\'m Kai. I\'m very busy. Do you know how many words you can spell with ice? I\'ve tried them all."',
      'N: You look closer. In one of his eyes there is a tiny, bright splinter of glass.',
      `G: "Oh! Oh my. Look at that."`,
      `G: "That's mine. That's a piece of me! The first Shard. At last."`,

  },
  c:function(s){
    var a=[{l:'Pull the shard out',d:'Kai is freed. The Mirror gets its piece.',go:'c13_pull',fx:function(x){x.shards=(x.shards||0)+1;addTether(3)}}];
    if(!s.flags.kaiAsked)a.push({l:'Ask Kai if it hurts',go:'c13_ask',fx:function(x){x.flags.kaiAsked=1}});
    if(s.skills.indexOf('strikethrough')>=0)a.push({l:'Breathe a fog over the shard',d:'Fog. Costs 2 Glamour.',go:'c13_fog',alt:true,fx:function(x){x.margin=Math.max(0,x.margin-2);x.fogged=(x.fogged||0)+1;award('clear')}});
    a.push({l:'Leave it. Find another way',go:'c13_leave',alt:true,fx:function(x){addTether(-2)}});
    return a;
  }};
SC.c13_ask={ch:13,noAsk:true,
  t:['A: "Hurt? No. Nothing hurts much. Everything is just a bit grey."',`G: "See? He doesn't feel a thing. Let's be quick."`],
  c:[{l:'Go back',go:'c13_kai'}]};
SC.c13_pull={ch:13,noAsk:true,
  t:['N: You reach out. The splinter slides into your fingers, cool and bright. Kai blinks. Then blinks again.',
     'A: "Oh! The snow... it\'s white. And pretty. And cold! Why am I sitting in the snow?"',
     'N: He runs off toward the village, laughing and shivering.',
     'N: The shard hums in your hand. Then it flows up into the glass of your screen like a drop of water into a pond.',
     'S: [Shard 1 of 7 returned. Favor +3.]',
     `G: "Oh. Oh, that's better. I haven't felt this much like myself in a hundred years."`,

  c:[{l:'Go on',go:lvl(12,'c14_in')}]};
SC.c13_fog={ch:13,noAsk:true,
  t:['S: [Skill used: Fog. Glamour -2.]',

SC.c13_leave={ch:13,noAsk:true,
  t:['A: "Okay. Bye."','N: Kai goes back to stacking letters.',`G: "Dear. That was ours."`,'N: For a second the warm voice goes flat and cold. Then it comes back, bright.',
     `G: "Never mind. There are six more."`,'S: [The shard stays with Kai. Favor -2.]'],
  c:[{l:'Go on',go:lvl(12,'c14_in')}]};

  on:function(s){giftTo(42)},
