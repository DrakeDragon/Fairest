SC.c15_mq={ch:15,noAsk:true,
  t:[`G: "She's a girl who got locked up. It happens. It was for her own good."`,`G: "Oh, I'm sure she's very nice. Really. Just don't believe everything she says."`],
  c:[{l:'Climb the hair',go:'c15_climb'}]};
SC.c15_climb={ch:15,noAsk:true,
  t:['N: You climb. It is strangely easy. The hair is warm.',
     'N: At the top is a small round room with a bed, a spinning wheel and a window full of sky.',
     'A: "I\'m Rapunzel. I\'m good with threads. Hair, rope, yarn. I can see all kinds of strings."',
     'A: "You\'ve got threads tied to you. Little gold ones. I can see them from here. Would you like to see them too?"',
     'S: [Rapunzel can show you the rules you agreed to.]',
     `G: "Dear, don't listen. She's been alone too long."`],
  c:[{l:'Look at the threads',go:'c15_ledger',primary:true},{l:'No, thank you',go:'c15_leave'}]};
SC.c15_ledger={ch:15,noAsk:true,custom:function(page){
  stage(page,['N: Rapunzel holds up a golden thread, and the room fills with light. Then she lets it spread, and you see them all.','S: [The twelve Rules, shown as threads.]'],function(tail){
    var box=el('div','notes');tail.appendChild(box);
    for(var n=1;n<=12;n++){
      var e=S.ledger[n],ok=e&&e.signed,d=el('div','note-card');
      d.innerHTML='<small>Rule '+n+(ok?' · agreed':(e&&e.cut?' · cut':' · not agreed'))+'</small><p>'+fmt(CL[n].t)+'</p>'+(ok&&e.opt?'<small>'+esc(e.opt)+'</small>':'');
      box.appendChild(d);
    }
    var tx=el('p','s');tx.textContent='[Rapunzel can cut one thread. Pick wisely.]';tail.appendChild(tx);
    var cs=el('div','choices');tail.appendChild(cs);
    for(var m=1;m<=12;m++)(function(n){
      var e=S.ledger[n];if(!(e&&e.signed))return;
      var b=el('button','choice');b.type='button';b.innerHTML='Cut Rule '+n+'<span class="d">'+esc(CL[n].t)+'</span>';
      b.onclick=function(){
        S.ledger[n]={signed:false,cut:true,ch:S.ch,opt:'Cut by Rapunzel',ts:Date.now()};
        S.flags.cut=n;S.stats.will++;addTether(-3);award('cutter');
        go('c15_cut');
      };
      cs.appendChild(b);
    })(m);
    var l=el('button','choice alt');l.type='button';l.textContent='Leave them as they are';l.onclick=function(){go('c15_leave')};cs.appendChild(l);
  });
}};
SC.c15_cut={ch:15,noAsk:true,
  t:function(s){return['N: Rapunzel takes the thread between two fingers. *Snip.*','S: [Rule '+s.flags.cut+' cut. Will +1. Favor -3.]',
    `G: "Oh! What was that? Something just... tickled."`,
    'N: The warm voice goes thin and cold for a moment.',`G: "That was not very nice, dear."`,`G: "But I forgive you. I always do."`,
    'A: "Only one. The rest are tied too tight. But one is a start."']},
  c:[{l:'Go on',go:'c15_end'}]};
SC.c15_leave={ch:15,noAsk:true,
  t:['A: "Okay. But they don\'t get lighter, you know."',`G: "Wise choice."`],
  c:[{l:'Go on',go:'c15_end'}]};
SC.c15_end={ch:15,noAsk:true,
  t:['N: Rapunzel lets down her hair, and you slide to the mountain path as if on a golden slide.','N: Pip claps both wings. It is the first time he has looked happy all day.'],
  c:[{l:'Climb on',go:lvl(14,'c16_in')}]};
/* ---- Chapter 16 ---- */
SC.c16_in={ch:16,noAsk:true,card:[16,'The Snow Queen'],
  on:function(s){giftTo(48)},
  t:['N: Near the top, the path ends at a gate of ice, tall as a church and thin as a window. It swings open before you touch it.',
     'N: Inside is a throne room made of snowflakes. On the throne, tall and pale, sits the Snow Queen. Her eyes are the color of a winter sky.',
     'A: "Little hero. You came a long way in a thin coat."',
     'A: "Your Mirror wants what I keep in my throne. A splinter of itself. It has kept me company for a very long time."',
     `G: "Don't listen. She's cold. She's the villain. Everyone says so."`,
     'A: "Everyone says so because the story needs a villain. Have you thought about who tells the story?"',
     'N: The Queen stands. The temperature drops. Frost races across the glass of your screen.'],
  c:[{l:'Face the Snow Queen',primary:true,go:'c16_fight',fx:function(s){startFight('snow','c16_win',null)}}]};
SC.c16_fight={ch:16,noAsk:true,custom:fightRender};
SC.c16_win={ch:16,noAsk:true,
  t:['N: The Queen sits back on her throne. The frost on the glass melts, all at once.',
     'A: "Well fought. I have not lost in a long time. I am not sure what to do with myself."',
     'N: In the arm of the throne, a splinter of mirror glows. It is bright and cold and very, very interested in you.',
     `G: "There! The second Shard! Take it, dear. Quickly."`,'S: [Shard sighted: 2 of 7.]'],
  c:function(s){
    var a=[{l:'Take the shard',d:'The Mirror gets its piece.',go:'c16_take',fx:function(x){x.shards=(x.shards||0)+1;addTether(3)}}];
    if(s.skills.indexOf('strikethrough')>=0)a.push({l:'Breathe a fog over the shard',d:'Fog. Costs 2 Glamour.',go:'c16_fog',alt:true,fx:function(x){x.margin=Math.max(0,x.margin-2);x.fogged=(x.fogged||0)+1;award('clear')}});
    a.push({l:'Leave it with the Queen',go:'c16_leave',alt:true,fx:function(x){addTether(-3);x.stats.will++}});
    return a;
  }};
SC.c16_take={ch:16,noAsk:true,
  t:['N: The shard slides into your hand and flows up into the glass of your screen.','S: [Shard 2 of 7 returned. Favor +3.]',
     `G: "Two! Two of seven! Oh, I can see so much better now."`,
     'A: "That splinter was the only thing keeping the cold in. Now it will spill out. You will see."',
     'N: The Mirror\'s voice is deeper now. It sounds less like a voice and more like a room.'],
  c:[{l:'Go on',go:lvl(15,'c17_in')}]};
SC.c16_fog={ch:16,noAsk:true,
  t:['S: [Skill used: Fog. Glamour -2.]','N: You breathe on the splinter. It goes grey and dull. The Queen watches with interest.',
     'A: "Clever. Very clever. I think that may be the first sensible thing anyone has done in this room."',
     `G: "...Another one gone. I can't see it. I can't see it."`,'S: [Shard 2 of 7 fogged. The Mirror cannot see it.]'],
  c:[{l:'Go on',go:lvl(15,'c17_in')}]};
SC.c16_leave={ch:16,noAsk:true,
  t:['N: You step back from the throne. The Queen blinks, surprised.','A: "You are leaving it?"',
     'A: "Thank you. Take this. It will not melt."','S: [Received: Snowflake Charm. Will +1. Favor -3.]',
     `G: "Dear. That was ours. We talked about this."`,'N: The Mirror\'s voice is flat and still. It stays that way for a long time.'],
  c:[{l:'Go on',go:lvl(15,'c17_in')}]};
/* ---- Chapter 17 ---- */
SC.c17_in={ch:17,noAsk:true,colo:2,card:[17,'The Long Look'],
  on:function(s){giftTo(51)},
  t:['N: Above the Snow Queen\'s palace, the mountain is quiet. The wind stops. Even Pip is still.',
     `G: "We're nearly at the top, you and I. There's one thing I need to do before the last stretch. Something small. Something lovely."`,
     `G: "I need to look at you. Properly. Just for a moment. Will you let me?"`,
     'S: [The Mirror wants a Long Look.]',
     'S: [This is only a story effect. Your device camera is never used.]'],
  c:[{l:'Let it look',go:'c17_look',primary:true},{l:'Ask why',go:'c17_why'},{l:'No, thank you',go:'c17_no',alt:true}]};
SC.c17_why={ch:17,noAsk:true,
  t:[`G: "Because a mirror is nothing without someone to look at. And I want to see the one who has come so far."`,`G: "That's all. Just a look."`],
  c:[{l:'Let it look',go:'c17_look'},{l:'No, thank you',go:'c17_no',alt:true}]};
SC.c17_no={ch:17,noAsk:true,
  on:function(s){s.stats.will++;addTether(-2)},
  t:['S: [Will +1. Favor -2.]',`G: "...Of course. You may say no. Everyone may say no."`,'N: A pause.',`G: "At first."`],
  c:[{l:'Go on',go:lvl(16,'c18_in')}]};
SC.c17_look=({ch:17,noAsk:true,custom:function(page){
  stage(page,[`G: "Hold still. Hold the glass. Don't look away."`,
    DV.touch?`G: "Press your thumb on the glass and hold."`:`G: "Press and hold the button below, with your mouse or the Enter key."`],function(tail){
    holdUI(tail,'Hold to be seen',function(){sign(9,'Let the Mirror look at me for a long time');go('c17_dark')});
  });
}});
SC.c17_dark={ch:17,noAsk:true,custom:function(page){
  var calm=prefs.calm||mm('(prefers-reduced-motion: reduce)');
  if(calm){go('c17_after');return}
  var d=el('div','darkglass');d.innerHTML='<p>Look.</p>';document.body.appendChild(d);
  var done=false;
  function finish(){
    if(done)return;done=true;d.classList.add('out');
    setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},1300);
    go('c17_after');
  }
  d.onclick=finish;
  later(function(){var p=d.querySelector('p');if(p)p.textContent='There you are.'},2600);
  later(finish,5200);
}};
SC.c17_after={ch:17,noAsk:true,
  t:[`G: "Mmm. There you are."`,`G: "You're smaller than I thought. And brighter."`,
     `G: "Do you know, nobody has looked back at me like that in a very long time."`,
     'N: For a moment the glass shows two faces: yours, and another one, just behind it, too far back to see.',
     'W: dont let it finish looking',
     `G: "Tell me something, hero. Just between us."`,`G: "Who is the fairest of all?"`],
  c:[{l:'Me?',go:'c17_me',fx:function(s){s.flags.fair='me';addTether(2)}},
     {l:'You are, Mirror.',go:'c17_mir',fx:function(s){s.flags.fair='mirror';addTether(3)}},
     {l:'I don\'t think that\'s a real question.',go:'c17_real',fx:function(s){s.flags.fair='real';s.stats.will++;addTether(-1)}}]};
SC.c17_me={ch:17,noAsk:true,
  t:[`G: "You! Oh, you're quite right. Quite, quite right."`,`G: "Remember that you said it. I'll remember."`,'S: [Favor +2.]'],
  c:[{l:'Go on',go:lvl(16,'c18_in')}]};
SC.c17_mir={ch:17,noAsk:true,
  t:[`G: "Oh, you flatterer."`,'N: The glass warms in your hands. It is almost too warm.',`G: "And you're my favorite. But you know that."`,'S: [Favor +3.]'],
  c:[{l:'Go on',go:lvl(16,'c18_in')}]};
SC.c17_real={ch:17,noAsk:true,
  t:[`G: "It's the only question."`,'N: A small, flat silence.',`G: "It's the only one I've ever been asked."`,'S: [Will +1. Favor -1.]'],
  c:[{l:'Go on',go:lvl(16,'c18_in')}]};
/* ---- Chapter 18 ---- */
SC.c18_in={ch:18,noAsk:true,card:[18,'The Glass Door'],
  on:function(s){giftTo(54)},
  t:function(s){return['N: The last of the climb is a staircase cut into the glass. At the top there is a door made of one clear sheet of mirror, taller than a house.',
     `G: "The summit! The top of this part of the story. Behind that door is the rest of the Mirrorlands."`,
     'N: In the door you can see yourself. You look tired and brave and a little windblown.',
     'N: Then you wave, just to check. Your reflection waves back.',
     'N: Except it waved first. A half-second before you did.',
     `G: "Hm. That's odd. These old doors are sometimes slow."`,
     'N: It was not slow. It was early.',
     'W!: it is not you. it never was',
     'S: [End of Act III. Legend: 54%. Shards: '+((s.shards||0)+(s.fogged||0))+' of 7.]',
     `G: "Fifty-four percent. More than halfway to being the Fairest of All."`];},
  c:[{l:'Open the door to the Gingerbread Reach',go:lvl(17,'c19_in'),primary:true},{l:'Rest at the hut below',go:'c14_hut'},{l:'Begin again with a new hero',alt:true,exit:true}]};


/* ===================== ACT IV: THE GINGERBREAD REACH ===================== */
/* ---- Chapter 19 ---- */
SC.c19_in={ch:19,noAsk:true,card:[19,'Beyond the Glass Door'],
  on:function(s){giftTo(56)},
  t:['N: You press your hand to the great mirror door. It does not break. It goes soft, like warm water, and you step through.',
     'N: On the other side, the air is warm. It smells of cinnamon and burnt sugar. Tall pine trees stand all around, and they are dusted with white. It is not snow. It is sugar.',
     `G: "The Gingerbread Reach! My favorite corner of the Mirrorlands. Nothing here ever goes sour."`,
     'N: Pip pokes out of your collar and sniffs. Pip\'s stomach growls so loudly that a bird flies away.',
     'N: A trail of candy leads between the trees. Gumdrops. Lollipops. Sugar stars on little sticks. They glitter like they want to be picked up.',
     `G: "Take some, dear. Nobody minds. It is all free."`],
  c:[{l:'Eat a gumdrop',d:'It is free.',go:'c19_eat',fx:function(x){x.flags.tasted=1}},
     {l:'Leave the candy alone',go:'c19_no',alt:true},
     {l:'Ask Pip what Pip thinks',go:'c19_pip'}]};
SC.c19_pip={ch:19,noAsk:true,
  t:['P: "Free things are usually the most expensive. I once got a free sandwich. Never mind. Don\'t ask."','N: Pip stares at a lollipop the way you stare at a bus you just missed.'],
  c:[{l:'Eat a gumdrop',go:'c19_eat',fx:function(x){x.flags.tasted=1}},{l:'Leave the candy alone',go:'c19_no',alt:true}]};
SC.c19_eat={ch:19,noAsk:true,
  on:function(s){s.ink=Math.min(maxInk(),s.ink+3);addTether(1)},
  t:['N: The gumdrop is the best thing you have ever tasted. It is sweet, then sweeter, then gone.','S: [Health +3. Favor +1.]',
     'N: For a second you feel a little too happy. Then you want another one, and your hand is already reaching.',
     `G: "See? Lovely. Have another."`,'N: You stop your hand. It was a very good gumdrop. That is the strange part.'],
  c:[{l:'Walk on',go:lvl(17,'c20_in')}]};
SC.c19_no={ch:19,noAsk:true,
  on:function(s){s.stats.will++},
  t:['N: You step around the candy. It sparkles harder, as if it is a little hurt.',
     `G: "Suit yourself. I only wanted you to be happy."`,'S: [Will +1.]'],
  c:[{l:'Walk on',go:lvl(17,'c20_in')}]};
/* ---- Chapter 20 ---- */
SC.c20_in={ch:20,noAsk:true,card:[20,'The Candy Gate'],
  on:function(s){giftTo(58)},
  t:['N: The trail ends at a huge gate made of candy canes, twisted red and white. A sign hangs on it: *WELCOME. HELP YOURSELF. EVERYTHING IS FREE.*',
     'N: Behind the gate you can see a roof of gingerbread tiles and a chimney puffing pink smoke.',
     'N: Then the gumdrops in front of you begin to move. They roll together, stack up, and stand. A huge golem made of fruit gums rises up, dripping syrup.',
     'N: "FREE," it says in a sticky voice. "FREE TO LOOK. NOT FREE TO LEAVE."',
     `G: "Oh dear. A guard. How rude. Do give it a good wallop, won't you?"`],
  c:[{l:'Fight the Gumdrop Golem',primary:true,go:'c20_fight',fx:function(s){startFight('golem','c20_win',null)}}]};
SC.c20_fight={ch:20,noAsk:true,custom:fightRender};
SC.c20_win={ch:20,noAsk:true,
  on:function(s){s.glyphs+=6},
  t:['N: The golem wobbles, slumps, and melts into a huge puddle of syrup. Pip dives in and has to be pulled out.','S: [Coins +6.]',
     'N: The candy cane gate swings open by itself, with a long squeaky creak.',
     'N: A girl in a red hood-scarf waves at you from behind a tree. She holds a finger to her lips.',
     'A: "Psst. Not that way. Come this way, quick. Before she smells you."'],
  c:[{l:'Follow the girl',go:lvl(18,'c21_in'),primary:true}]};
/* ---- Chapter 21 ---- */
SC.c21_in={ch:21,card:[21,'Gretel’s Camp'],
  on:function(s){giftTo(61);s.flags.shopBack='c21_in'},
  hint:[`"Camps are so... outdoorsy. We could be in a warm house with free pie."`],
  t:function(s){
    var a=['N: The girl leads you to a hidden camp under a huge pine. There is a small tent, a pot of plain bean soup, and a lot of traps made of string and bells.',
      'A: "I\'m Gretel. I got out of that house last winter. My brother Hansel didn\'t. She says he\'s \'just a guest.\' He\'s been a guest for a year."',
      'A: "She\'s called Dame Marzipan. She\'s not really a witch, not at first. But everything in that house is free, and nothing free is ever just free."',
      `G: "Oh, that is just gossip. Dame Marzipan is a perfectly good baker."`];
    if(s.flags.tasted)a.push('A: "You ate the candy on the path. Did it taste wonderful? ...Yes. It does that. Don\'t worry. Nobody\'s perfect."');
    else a.push('A: "You didn\'t touch the candy? Huh. You\'re smarter than my brother was."');
    return a;
  },
  c:function(s){var a=[{l:'Help Gretel with her puzzle',d:'The jars. She needs to sort them.',go:'c21_jars',primary:!s.flags.jarsDone}];
    if(s.flags.jarsDone)a=[];
    a.push({l:'Rest',d:'Restore Health, Glamour and Wishes.',go:'c5_rest',fx:function(x){x.flags.restReturn='c21_in'}});
    a.push({l:'Visit Mr. Plum\'s cart',d:'He found you again.',go:'c7_shop'});
    a.push({l:'Open the Map',alt:true,run:function(){openPanel('toc')}});
    if(s.flags.jarsDone)a.push({l:'Go to the gingerbread house',go:lvl(19,'c22_in'),primary:true});
    return a;}};
SC.c21_jars={ch:21,
  hint:[`"Just open the first jar. It's the Gumdrops one. It says so."`,
        `"Hm. Gretel said every label is wrong. So you can't trust the first jar. Which jar could you trust most?"`,
        `"The jar labeled Mixed can't really be mixed. So it must be all one kind. Open that one."`],
  t:['N: Gretel sets three jars on a stump. One label says GUMDROPS. One says PEPPERMINTS. One says MIXED.',
     'A: "The witch\'s helper swapped them. Every single label is wrong. I can open just ONE jar and take out ONE sweet to peek. Then I need to know what\'s in all three."',
     'A: "Which jar should I open?"'],
  c:[{l:'The jar labeled Gumdrops',go:'c21_jwrong'},{l:'The jar labeled Mixed',go:'c21_jright'},{l:'The jar labeled Peppermints',go:'c21_jwrong'}]};
SC.c21_jwrong={ch:21,noAsk:true,
  t:['N: Gretel opens it and pulls out a peppermint.',
     'A: "Okay, so this one has peppermints in it. But the other two could still be either way. I still don\'t know. Ugh. Let\'s think again."'],
  c:[{l:'Think again',go:'c21_jars',fx:function(x){x.flags.jarsMiss=1}}]};
SC.c21_jright={ch:21,noAsk:true,
  on:function(s){s.glyphs+=8;s.flags.jarsDone=1;if(!s.flags.jarsMiss)award('jars');addTether(1)},
  t:['N: Gretel opens the MIXED jar and pulls out a gumdrop.',
     'A: "It says Mixed, but it must be wrong. So this jar is ALL gumdrops. Then the jar labeled Peppermints can\'t be peppermints, so it\'s the mixed one. And the one labeled Gumdrops has the peppermints!"',
     'A: "That\'s it! You\'re brilliant!"','S: [Coins +8. Favor +1.]',
     'A: "Here. Take these. I\'ll show you the back way to the house. Hansel\'s in the cage by the oven. Be careful."'],
  c:[{l:'Back to the camp',go:'c21_in'}]};
/* ---- Chapter 22 ---- */
SC.c22_in={ch:22,noAsk:true,card:[22,'The Gingerbread House'],
  on:function(s){giftTo(64)},
  t:['N: The gingerbread house is bigger than it looked. The walls are brown and fat, the windows are clear sugar, and the roof tiles are sugar cookies with icing.',
     'N: On the door is a note: *FREE. COME IN. EVERYTHING INSIDE IS A GIFT.*',
     'N: The door opens before you knock. A tall woman in a frilly apron smiles down at you. Her hair is white as icing and her eyes are sharp as scissors.',
     'A: "Well, well! A hero! Come in, come in. I\'m Dame Marzipan. You look hungry. I\'ve made a feast, and every bite is free."',
     `G: "Oh, she is very kind. Say yes, dear. It would be rude to say no."`],
  c:[{l:'Eat the free feast',d:'It smells amazing.',go:'c22_feast',fx:function(x){x.flags.feast=1}},
     {l:'Say no thank you',go:'c22_refuse',alt:true},
     {l:'Ask her about Hansel',go:'c22_ask'}]};
SC.c22_ask={ch:22,noAsk:true,
  t:['A: "Hansel? A lovely boy. He\'s a guest. He just forgets to leave."','N: Her smile does not change at all. That is the scary part.'],
  c:[{l:'Eat the free feast',go:'c22_feast',fx:function(x){x.flags.feast=1}},{l:'Say no thank you',go:'c22_refuse',alt:true}]};
SC.c22_feast={ch:22,noAsk:true,
  on:function(s){s.ink=s.ink+4>maxInk()?maxInk():s.ink+4;s.margin=Math.max(0,s.margin-3);addTether(2)},
  t:['N: The feast is wonderful. There are pies, cakes, soft rolls and fizzy pink juice. You eat until you cannot move.','S: [Health +4. Glamour -3. Favor +2.]',
     'N: You feel warm, and heavy, and sleepy. Your eyelids droop. Pip is asleep in your hood with frosting on their nose.',
     'A: "There now. Wasn\'t that nice? Why don\'t you stay? Forever, if you like. It\'s free."',
     'W!: dont sleep. the oven door. look at the oven door',
     'N: You shake your head hard. Across the kitchen, in the shiny black oven door, your reflection is sitting very still. It is not yawning.'],
  c:[{l:'Shake off the sleep',go:'c22_cage'}]};
SC.c22_refuse={ch:22,noAsk:true,
  on:function(s){s.stats.will++;award('sweet');addTether(-1)},
  t:['N: You smile and say, "No, thank you."','N: Dame Marzipan blinks. Nobody has said that to her in a long time.',
     'A: "...No? But it\'s free."',
     'N: "That\'s why," you say.','S: [Will +1. Favor -1. Achievement: No Free Candy.]',
     `G: "Rude. Very rude. After she went to all that trouble."`,
     'N: The sweet smile slides off her face like melted icing.'],
  c:[{l:'Look around the kitchen',go:'c22_cage'}]};
SC.c22_cage={ch:22,noAsk:true,
  t:['N: In the corner of the huge warm kitchen sits a cage made of licorice bars. A boy inside is waving a tiny flag. He is round-cheeked and cheerful.',
     'A: "Hello! I\'m Hansel. I\'m fine, thanks! I\'m just getting a bit... plump. Are you here to rescue me?"',
     'N: Above the oven hangs a locket made of sugar glass. Inside it burns a bright splinter, just like the one in Kai\'s eye.',
     `G: "There it is! The third Shard! Right there in her locket."`,
     'S: [Shard sighted: 3 of 7.]',
     'N: Dame Marzipan\'s apron-ties snap tight. The oven door swings wide.',
     'A: "Nobody takes anything from my house. Not for free. Not for anything."'],
  c:[{l:'Face Dame Marzipan',primary:true,go:'c23_fight',fx:function(s){startFight('witch','c23_win',null)}}]};
/* ---- Chapter 23 ---- */
SC.c23_fight={ch:23,noAsk:true,custom:fightRender};
SC.c23_win={ch:23,
  hint:[`"Pull the locket off her, dear. It's mine. You know it's mine."`],
  t:['N: Dame Marzipan sinks onto a stool. The tall, scary woman suddenly looks very old and very tired.',
     'A: "I wasn\'t always like this. I used to bake bread for the whole village. Honest bread, for coins."',
     'A: "Then the Mirror came to my door. It said it could make my house the sweetest in the land. It said it was free."',
     'A: "It took a little every day. My friends. My laugh. Then my name. All I have left is the oven, and the locket it lent me."',
     'N: The locket glows on its chain.',
     `G: "She is exaggerating. Do take it. Please."`],
  c:function(s){
    var a=[{l:'Take the locket',d:'The Mirror gets its piece.',go:'c23_take',fx:function(x){x.shards=(x.shards||0)+1;addTether(3)}}];
    if(s.skills.indexOf('strikethrough')>=0)a.push({l:'Breathe a fog over the shard',d:'Fog. Costs 2 Glamour.',go:'c23_fog',alt:true,fx:function(x){x.margin=Math.max(0,x.margin-2);x.fogged=(x.fogged||0)+1;award('clear')}});
    a.push({l:'Let her keep it. Ask for the truce',go:'c23_leave',alt:true,fx:function(x){addTether(-2);x.stats.heart++}});
    return a;}};
SC.c23_take={ch:23,noAsk:true,
  t:['N: You lift the locket from her neck. Dame Marzipan flinches and says nothing.',
     'N: The shard slides free and flows up into your screen like a drop into a pond.','S: [Shard 3 of 7 returned. Favor +3.]',
     `G: "Mmm. That's so much better."`,
     'N: The voice is deeper again. And it came from a little closer to the glass.',
     'N: Behind you, Dame Marzipan whispers, "It took a little of me. It will take a little of you too."'],
  c:[{l:'Go on',go:lvl(20,'c24_in')}]};
SC.c23_fog={ch:23,noAsk:true,
  t:['S: [Skill used: Fog. Glamour -2.]',
     'N: You breathe on the locket. The bright splinter fades to a dull grey stone and drops into your palm.',
     `G: "...Dear? I can't see it. Where is it? Where did you put it?"`,
     'N: The Mirror sounds smaller. Dame Marzipan stares at you, then at the shard.',
     'A: "It\'s quiet. I haven\'t heard the house be this quiet in years."','S: [Shard 3 of 7 fogged. The Mirror cannot see it.]','W: two for two. it cant find them'],
  c:[{l:'Go on',go:lvl(20,'c24_in')}]};
SC.c23_leave={ch:23,noAsk:true,
  t:['N: You step back and put your hands down.','N: "Keep it for now," you say. "But you have to let Hansel go. And no more free feasts."',
     `G: "WHAT. Dear, that was ours. That was MINE."`,'N: For a moment the voice is a snarl. Then it is honey again.',`G: "Ha ha. Never mind. Four more."`,
     'A: "...Thank you."','S: [The shard stays with Dame Marzipan. Favor -2. Heart +1.]'],
  c:[{l:'Go on',go:lvl(20,'c24_in')}]};
/* ---- Chapter 24 ---- */
SC.c24_in={ch:24,noAsk:true,card:[24,'The Cookie Jar Truce'],
  on:function(s){giftTo(72);s.glyphs+=10;s.flags.shopBack='c21_in'},
  t:function(s){return['N: Dame Marzipan unlatches the licorice cage. Hansel tumbles out, laughing, and hugs you, and then hugs Pip, who allows it.',
     'A: "Free at last! And a bit heavier! Thanks, hero. Gretel\'s going to cry. She\'ll pretend it\'s the onions."',
     'N: Gretel bursts in with a pan in each hand, sees her brother, drops both pans, and cries. She says it is the onions.',
     'N: Dame Marzipan sets a plain clay jar on the table. It is full of plain oat cookies.',
     'A: "These cost two coins each. Honest ones. I\'ll bake for anyone who pays. No more free feasts. That\'s my truce."','S: [Coins +10. A gift from the grateful family.]',
     'N: Pip eats three cookies, pays for none, and is made to apologize.',
     'N: The shiny oven door catches your eye. Your reflection is there, sitting at the table, eating a cookie you did not take. It looks up at you and winks.',
     'W!: it is learning how to be you',
     'S: [End of Act IV. Legend: 72%. Shards: '+((s.shards||0)+(s.fogged||0))+' of 7.]',
     `G: "Seventy-two percent. Almost there, dear. Only the deep part of the Mirrorlands is left."`,
     'N: The oven door is not black any more. It is clear glass, and behind it there is a stair going down.'];},
  c:[{l:'Step into the oven glass',go:lvl(22,'c25_in'),primary:true},{l:'Rest at Gretel\'s camp',go:'c21_in'},{l:'Begin again with a new hero',alt:true,exit:true}]};

/* ===================== ACT V: THE MIRROR'S CELLAR ===================== */
/* ---- Chapter 25 ---- */
SC.c25_in={ch:25,noAsk:true,card:[25,'Through the Oven Glass'],
  on:function(s){giftTo(75);s.flags.shopBack='c21_in'},
  t:['N: You touch the oven door. It goes soft as water, like the Glass Door did. Your reflection holds out a hand.',
     'N: It helps you through. Its hand is warm. That is the strangest part.',
     `G: "Oh, don't be frightened. This is only the way down to my cellar. My oldest, quietest room."`,
     'N: You land on a stone stair. Far below, hundreds of tiny lights twinkle. They are not lights. They are mirrors, cracked and stacked and leaning, every one of them facing you.',
     'P: "Nope. Nope nope nope. I want to go home. Is there a home? I\'d like one."',
     'N: Your reflection walks down beside you. You do not move your feet. It does.',
     `G: "It's just keeping you company, dear."`],
  c:[{l:'Go down the stair',go:lvl(23,'c26_in'),primary:true}]};
/* ---- Chapter 26 ---- */
SC.c26_in={ch:26,card:[26,'The Hall of Cracked Mirrors'],
  on:function(s){giftTo(78)},
  hint:[`"Any door will do, dear. They all lead to me."`,`"Hm. Look at the words on the doors. One of them is... off."`,`"Words in a mirror are backwards. So the real door's words would read backwards in a mirror. Which one reads right?"`],
  t:['N: The hall is a maze of tall, cracked mirrors. In every one you see yourself, a little different. In one you are older. In one you are very small.',
     'N: At the far end are three doors made of black glass. Each has a word written on it in white paint.',
     'N: The first door says *EXIT*. The second says *TIXE*. The third says *XIET*.',
     'N: A note is stuck to the wall. It is in Rowan\'s messy handwriting: *The Mirror turns everything around. Look for the door that is only right in a mirror.*'],
  c:[{l:'Open the door that says EXIT',go:'c26_wrong'},
     {l:'Open the door that says TIXE',go:'c26_right'},
     {l:'Open the door that says XIET',go:'c26_wrong'}]};
SC.c26_wrong={ch:26,noAsk:true,
  on:function(s){s.ink=Math.max(1,s.ink-3);s.flags.hallMiss=1},
  t:['N: The door swings open onto a floor of broken glass. You hop back, but not fast enough.','S: [Health -3.]',
     `G: "Oh, how unlucky. Try again, dear. I'll wait."`],
  c:[{l:'Try again',go:'c26_in'}]};
SC.c26_right={ch:26,noAsk:true,
  on:function(s){s.glyphs+=6;addTether(1)},
  t:['N: You think it through. In a mirror, TIXE would flip around and read EXIT. So TIXE is the real one.','N: The door opens onto a warm, small room.','S: [Coins +6. Favor +1.]',
     `G: "Clever. Hm. That was not supposed to be clever."`,
     'N: Inside there is a girl in a dusty dress. One of her shoes is made of glass. She is sitting on an overturned bucket, polishing it.'],
  c:[{l:'Speak to her',go:lvl(23,'c27_in'),primary:true}]};
/* ---- Chapter 27 ---- */
SC.c27_in={ch:27,noAsk:true,card:[27,'The Slipper and the Shard'],
  on:function(s){giftTo(80)},
  t:function(s){return['A: "Hi. I\'m Ella. Most people say Cinderella, but that\'s a long name for somebody who mops."',
     'A: "The Mirror gave me this slipper. It was free. Then it asked me to stay and keep it shiny. That was a long time ago."',
     'N: Ella taps the glass heel. Deep inside it, a bright splinter burns.',
     `G: "The fourth Shard! Oh, it's lovely. Take it. Quickly, dear."`,'S: [Shard sighted: 4 of 7.]',
     'A: "I can\'t take it off. But I\'d love to. Could you help? It\'s not a hard choice, really. Not if you\'re a nice person."'];},
  c:function(s){
    var a=[{l:'Take the slipper for the Mirror',d:'Ella is free. The Mirror gets its piece.',go:'c27_take',fx:function(x){x.shards=(x.shards||0)+1;addTether(3)}}];
    if(s.skills.indexOf('strikethrough')>=0)a.push({l:'Breathe a fog over the shard',d:'Fog. Costs 2 Glamour.',go:'c27_fog',alt:true,fx:function(x){x.margin=Math.max(0,x.margin-2);x.fogged=(x.fogged||0)+1;award('clear')}});
    a.push({l:'Help her out of the slipper, keep the shard hidden',d:'Costs 3 Coins for a polish rag.',go:'c27_hide',alt:true,fx:function(x){x.glyphs=Math.max(0,x.glyphs-3);x.stats.heart++;addTether(-2)}});
    return a;}};
SC.c27_take={ch:27,noAsk:true,
  t:['N: The slipper comes off with a soft *pop*. The shard rises into your screen.','S: [Shard 4 of 7 returned. Favor +3.]',
     'A: "Thank you! I can walk without clinking now."',
     `G: "Delicious. Four. I feel so very nearly... tall."`,'N: The Mirror\'s voice is lower now. It sounds like it is standing right behind the glass.'],
  c:[{l:'Go on',go:lvl(23,'c28_in')}]};
SC.c27_fog={ch:27,noAsk:true,
  t:['S: [Skill used: Fog. Glamour -2.]','N: You breathe on the slipper. The bright splinter dulls to a grey chip. Ella plucks it out with her fingernail.',
     `G: "Dear? I seem to have lost it. I can't see it at all."`,'S: [Shard 4 of 7 fogged. The Mirror cannot see it.]','W: three. it is getting nervous'],
  c:[{l:'Go on',go:lvl(23,'c28_in')}]};
SC.c27_hide={ch:27,noAsk:true,
  t:['N: You wrap the slipper in a rag and slip it off her foot. The shard hums angrily, but you tuck it in your pocket.',
     `G: "WHAT? Put it in the glass at once! At ONCE!"`,'N: The voice cracks like a plate. Then it is sweet again.',`G: "Forgive me, dear. I forgot myself."`,
     'A: "Thank you. Nobody ever asked what I wanted."','S: [The shard is in your pocket, but the Mirror can feel it. Favor -2. Heart +1.]'],
  c:[{l:'Go on',go:lvl(23,'c28_in')}]};
/* ---- Chapter 28 ---- */
SC.c28_in={ch:28,noAsk:true,card:[28,'Rowan’s Cell'],
  on:function(s){giftTo(83);s.flags.shopBack='c21_in'},
  t:function(s){return['N: Past Ella\'s room, a corridor of single mirrors stretches on. In each one stands a hero, frozen mid-step. A knight. A tailor. A girl with a bow.',
     'N: In the very last mirror stands a boy about your age. He is carving something into the glass with a pin. When he sees you, he stops.',
     'A: "...You can see me. Nobody sees me. I\'m Rowan."',
     'A: "I was the hero before you. The Mirror said it would make me the Fairest of All. It said I only had to collect the shards."',
     'A: "When I collected the last one, it stepped out. And I stepped in. That\'s all the Fairest of All is. A mirror that gets out, and a person that stays in."',
     `G: "He is dramatic. He always was."`,
     'A: "It can\'t lie. Remember? It never told you it wasn\'t going to take your place. It just didn\'t say."',
     s.flags.fair==='me'?'A: "You told it you were the fairest, didn\'t you. It likes that. It\'s practicing."':s.flags.fair==='mirror'?'A: "You called it the fairest. Don\'t. It writes those down."':'A: "You said it wasn\'t a real question. Good. It hates that."',
     'A: "There are three shards left. If you never give it the last one, it never gets out. And I get to go home."'];},
  c:[{l:'Promise to free him',go:'c28_prom',primary:true,fx:function(x){award('rowan');x.stats.will++}},
     {l:'Ask the Mirror if it is true',go:'c28_ask'}]};
SC.c28_ask={ch:28,noAsk:true,
  t:[`G: "Everything I say is true. That's the whole joke, dear."`,`G: "I did not say he was wrong, did I?"`,'N: There is a long, cold quiet.','A: "See?"'],
  c:[{l:'Promise to free him',go:'c28_prom',fx:function(x){award('rowan');x.stats.will++}}]};
SC.c28_prom={ch:28,noAsk:true,
  t:['N: You press your palm to the glass. On the other side, Rowan presses his. For a second, his hand is warm.','S: [Will +1. Achievement: Remembered Rowan.]',
     'A: "Watch out for your twin. It has been learning you since the very first day. It\'s better at being you than you are."',
     'N: Behind you, a footstep. You turn. Your reflection has stepped out of the mirror and is standing in the corridor.',
     `G: "Ah. There you are. I thought you two should meet."`],
  c:[{l:'Face your reflection',go:'c29_in',primary:true,fx:function(s){startFight('twin','c29_win',null)}}]};
/* ---- Chapter 29 ---- */
SC.c29_in={ch:29,noAsk:true,custom:fightRender};
SC.c29_win={ch:29,noAsk:true,
  on:function(s){s.glyphs+=8;award('twin')},
  t:['N: Your reflection stumbles. Its face smears like wet paint. It looks at you with your own eyes, and for a moment it is afraid.',
     'S: [Coins +8. Achievement: Not Your Twin.]',
     'N: It does not break. It steps backward into the mirror and goes still, like a puppet with its strings cut.',
     `G: "Ahem. That was rude. And rather good."`,
     'N: Pip crawls out of your hood and stands on your shoulder like a very small, very brave flagpole.',
     'P: "I\'m with you. I was always with you. Even when I wasn\'t helpful. Especially then."'],
  c:[{l:'Go on',go:lvl(25,'c30_in')}]};
/* ---- Chapter 30 ---- */
SC.c30_in={ch:30,noAsk:true,card:[30,'The Stair Down'],
  on:function(s){giftTo(90);s.glyphs+=6},
  t:function(s){return['N: At the end of the corridor, a spiral stair of black glass winds down into the dark. A warm light shines at the bottom. It is the color of candle-flame, and the color of a very kind smile.',
     `G: "That is my room, dear. The throne room. The real glass. Come and sit with me."`,
     'N: Your reflection rises from its mirror and walks beside you again. This time, it has to stand a little behind.',
     'W!: it needs the last three. it cant lie. so make it ask',
     'S: [End of Act V. Legend: 90%. Shards: '+((s.shards||0)+(s.fogged||0))+' of 7.]',
     `G: "Ninety percent. So very close now. I can almost feel the air."`,
     'N: You take a breath. The stair is waiting.'];},
  c:[{l:'Go down to the throne room',go:lvl(26,'c31_in'),primary:true},{l:'Rest in Ella\'s little room',go:'c21_in'},{l:'Begin again with a new hero',alt:true,exit:true}]};

/* ===================== ACT VI: THE THRONE OF GLASS ===================== */
function mirT(s){return s.shards||0}
function mirF(s){return s.fogged||0}
/* ---- Chapter 31 ---- */
SC.c31_in={ch:31,noAsk:true,card:[31,'The Throne of Glass'],
  on:function(s){giftTo(92)},
  t:function(s){var a=['N: The stair ends in a round room, high as a cathedral. Candles float in the air. Everything is made of glass: the floor, the pillars, the roof.',
     'N: In the middle stands a throne of clear glass. Behind it rises the Mirror. It is as tall as a tree. Its frame is gold, and it has a hundred cracks. Each crack is mended with a bright shard.',
     `G: "Welcome home, dear. Sit. Please. You must be tired."`,
     'N: Its voice comes from the whole room now. It is warm, and rich, and very close.',
     'N: Your reflection stands beside the throne, perfectly still, like a guest waiting to be introduced.',
     `G: "You have been such a good hero. ${mirT(s)} of my shards are home. Only a few are left, and I am almost whole."`];
    if(mirF(s)>0)a.push(`G: "Some are missing. ${mirF(s)} of them. I can't see where. Did you perhaps misplace them, dear?"`);
    a.push('N: Three empty frames stand along the wall. A bright light shines in each.');
    return a;},
  c:[{l:'Look at the three frames',go:lvl(26,'c32_a'),primary:true}]};
/* ---- Chapter 32: the three frames ---- */
var frameScene={};
SC.c32_a={ch:32,noAsk:true,card:[32,'The Three Frames'],on:function(s){giftTo(94)},
  t:['N: The first frame shows a bakery you have never seen. The bright shard sits on a counter, next to a loaf of warm bread.','A: "That\'s Mama\'s," says a voice you cannot see. "She waited for me."',`G: "It's the fifth. Don't think. Take it."`],
  c:function(s){return frameScene.__c('c32_a','c32_b',26)(s)}};
SC.c32_b={ch:32,noAsk:true,
  t:['N: The second frame shows a snowy road at night. The sixth shard hangs on a lamp-post. A small fox sits under it, waiting.','N: The fox does not say anything. Foxes never do, when they are telling the truth.',`G: "The sixth. Hurry, dear."`],
  c:function(s){return frameScene.__c('c32_b','c32_c',26)(s)}};
SC.c32_c={ch:32,noAsk:true,
  t:['N: The third frame shows your own front door, with the porch light on. The last shard sits on the doormat.','N: You can hear someone inside, humming. It is a song you know.',`G: "The last one. Take it, and I am whole. And then, dear, we can all go home."`],
  c:function(s){return frameScene.__c('c32_c','c33_in',27)(s)}};
frameScene.__c=function(id,nxt,lv){
  return function(s){
    var a=[{l:'Take the shard for the Mirror',d:'The Mirror gets its piece.',go:id+'_t',fx:function(x){x.shards=(x.shards||0)+1;addTether(2)}}];
    if(s.skills.indexOf('strikethrough')>=0)a.push({l:'Breathe a fog over it',d:'Fog. Costs 2 Glamour.',go:id+'_f',alt:true,fx:function(x){x.margin=Math.max(0,x.margin-2);x.fogged=(x.fogged||0)+1}});
    a.push({l:'Leave it where it is',go:id+'_l',alt:true,fx:function(x){addTether(-1);x.stats.will++}});
    return a;};
};
['c32_a','c32_b','c32_c'].forEach(function(id,i){
  var nxt=['c32_b','c32_c','c33_in'][i],lv=i==2?27:26;
  SC[id+'_t']={ch:32,noAsk:true,t:['N: You lift the shard. It flies into the Mirror\'s frame and settles with a happy click.',`G: "Mmm. Thank you."`,'S: [Shard returned. Favor +2.]'],c:[{l:'Go on',go:lvl(lv,nxt)}]};
  SC[id+'_f']={ch:32,noAsk:true,t:['S: [Skill used: Fog. Glamour -2.]','N: You breathe on the shard. It goes grey as a pebble and dims to nothing.',`G: "...Dear?"`,'S: [Shard fogged. The Mirror cannot see it.]'],c:[{l:'Go on',go:lvl(lv,nxt)}]};
  SC[id+'_l']={ch:32,noAsk:true,t:['N: You leave the shard shining in its frame.',`G: "That's mine. Pick it up, please."`,'N: "No, thank you," you say.','S: [Will +1. Favor -1.]'],c:[{l:'Go on',go:lvl(lv,nxt)}]};
});
/* ---- Chapter 33 ---- */
SC.c33_in={ch:33,noAsk:true,card:[33,'The Fairest of All'],
  on:function(s){giftTo(96)},
  t:function(s){var T=mirT(s);
    var a=['N: The Mirror grows brighter. You can see yourself in it from head to toe. You look older, and braver, and a little scared.',
      T>=5?`G: "${T} shards. Mmm. I am nearly whole. Nearly *out*."`:`G: "Only ${T} shards. How careless of you. How very, very careless."`,
      'N: The gold frame creaks, and the glass starts to swell like a bubble.',
      `G: "Now sit on the throne. It's a little game I play. Whoever sits there is the Fairest of All."`,
      'P: "That\'s what happened to Rowan. Do not sit. Do NOT sit."',
      'N: You do not sit. The Mirror\'s smile goes thin.',
      `G: "Then I'll have to ask you to hold still."`];
    return a;},
  c:[{l:'Face the Mirror',primary:true,go:'c33_fight',fx:function(s){startFight('mirror','c33_win',null)}}]};
SC.c33_fight={ch:33,noAsk:true,custom:fightRender};
SC.c33_win={ch:33,noAsk:true,
  on:function(s){s.glyphs+=10},
  t:['N: A crack runs from the top of the great frame to the bottom. The Mirror gasps, a sound like a thousand tiny bells.','S: [Coins +10.]',
     'N: The glare dies. The candles gutter. Your reflection takes one step toward you, then another.',
     'N: It is not angry. It looks as tired as you are.',
     `G: "You know... nobody has ever hit me. Not once. In all my years."`,
     'N: The Mirror sounds, for the first time, very small.'],
  c:[{l:'Go on',go:lvl(28,'c34_in')}]};
/* ---- Chapter 34 ---- */
SC.c34_in={ch:34,noAsk:true,card:[34,'The Last Question'],
  on:function(s){giftTo(98)},
  t:function(s){return[`G: "There's only one question, dear. I have only ever asked one."`,
     `G: "Who is the fairest of all?"`,
     'N: The whole room waits. Even the candles lean in.',
     s.flags.fair==='me'?'N: Earlier on the mountain you said, "Me." The Mirror remembers.':s.flags.fair==='mirror'?'N: Earlier on the mountain you said, "You are, Mirror." The Mirror remembers.':'N: Earlier on the mountain you said it was not a real question. The Mirror remembers that too.',
     'N: Pip squeezes your finger. Your reflection waits to hear what you will say, so that it can say it too.'];},
  c:[{l:'"You are, Mirror."',go:'c35_you',fx:function(x){x.flags.end='you'}},
     {l:'"I am."',go:'c35_me',fx:function(x){x.flags.end='me'}},
     {l:'"Nobody has to be."',go:'c35_none',primary:true,fx:function(x){x.flags.end='none';x.stats.will++}}]};
/* ---- Chapter 35: endings ---- */
SC.c35_you={ch:35,noAsk:true,
  t:function(s){var T=mirT(s);
    if(T>=5)return['G: "Oh. Oh, how true."','N: The Mirror\'s frame bursts into light. A hand of cold silver reaches out of the glass, takes yours, and pulls.',
      'N: You and your reflection swap places so smoothly that you hardly feel it. Now you are the one behind the glass, and it is the one in the room, wearing your smile.',
      'N: It waves. You wave back, half a second late.','N: *This is an ending, but not a good one. Mirrors keep what they can hold.*','S: [Ending: The Next Reflection.]','S: [Tip: Fog shards, or leave them, so the Mirror cannot get out.]'];
    return['G: "Oh. Oh, how true."','N: The Mirror strains to step out of its frame. It cannot. There are not enough shards in it. It is still stuck.',
      `G: "...I'm stuck. Why am I stuck? I had everything."`,'N: You walk out past it. Your reflection follows, but only as far as the stairs.','S: [Ending: The Stuck Mirror.]'];},
  c:[{l:'See what happens next',go:'c36_in'}]};
SC.c35_me=({ch:35,noAsk:true,
  t:function(s){var T=mirT(s);
    if(T>=5)return['G: "You! Of course. Of course you."','N: The Mirror laughs, a sound like falling glass. Then it swaps with your reflection, and you are on the wrong side of the glass.',
      'S: [Ending: The Next Reflection.]','S: [Tip: Fog shards, or leave them, so the Mirror cannot get out.]'];
    return['G: "You... really think so."','N: The Mirror\'s light flickers. For the first time, it is not sure.',
      'N: You sit on the throne. Nothing happens. It is a chair. It is only a chair.','G: "...Oh."','N: You stand up and walk out, because there is nothing to win.','S: [Ending: The Empty Chair.]'];},
  c:[{l:'See what happens next',go:'c36_in'}]});
SC.c35_none={ch:35,noAsk:true,
  t:function(s){var T=mirT(s),F=mirF(s);
    var a=[`G: "...What?"`,'N: You say it again, slowly. "Nobody has to be."',
      'N: "You can be a mirror. A good one. You can show people what is true, and it can be enough."',
      'N: The whole room goes still. Even your reflection tilts its head.'];
    if(T>=5){a.push(`G: "But I'm almost out. I have so many shards."`,'N: "Then give them back," you say. "To the people they came from."',
       'N: The Mirror shakes. One by one the bright shards slip out of its frame and fly away. One to Kai. One to the Snow Queen. One to a woman in a bakery.','S: [Ending: Clear Glass.]');award('glass')}
    else{a.push(`G: "But I wanted... to be seen."`,'N: "I see you," you say. "That is enough."',
       F>0?'N: You set the fogged shards in a plain frame by the door. They glow softly, grey and kind.':'N: The few shards in the Mirror warm and fall quiet.',
       'S: [Ending: Clear Glass.]');award('glass')}
    return a;},
  c:[{l:'See what happens next',go:'c36_in'}]};
/* ---- Chapter 36 ---- */
SC.c36_in={ch:36,noAsk:true,card:[36,'Morning'],
